<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caixa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --paper:#EDEFE8;--surface:#FAFBF7;--surface-2:#E4E8DD;--ink:#17211B;--ink-soft:#5A665C;
  --line:#D2D8C9;--green:#1D6B4F;--rust:#9C3B2E;--ochre:#B4801A;--ochre-soft:#F2E6CC;
  --on-green:#fff;--r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#131A16;--surface:#1B231E;--surface-2:#232C26;--ink:#E8EDE6;--ink-soft:#97A497;
  --line:#2F3A33;--green:#5BC49A;--rust:#E08573;--ochre:#DFB055;--ochre-soft:#3A2F1A;--on-green:#0E1713;}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  /* o toque não seleciona texto nem abre o menu de copiar — comportamento de app, não de página */
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));}
h1,h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:-.015em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
/* campos de digitação continuam selecionáveis, senão não dá para editar */
input,select,textarea{-webkit-user-select:text;user-select:text}
/* valores em dinheiro: toque longo ainda copia, para quando você quiser conferir */
.saldo,.fatura,.v,.stat b{-webkit-user-select:text;user-select:text}

input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.mhead{display:flex;align-items:center;gap:10px}
.mhead h1{font-size:19px;flex:1;text-align:center}
.mhead h1 small{display:block;font-family:"IBM Plex Sans";font-weight:500;font-size:11px;color:var(--ink-soft)}
.step{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:50%;
  display:grid;place-items:center;font-size:16px;line-height:1;padding:0}
main{padding:16px 16px 24px;max-width:640px;margin:0 auto}

.ribbon{margin:0 0 14px}
.figs{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.saldo{font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1;font-variant-numeric:normal}
.saldo.neg{color:var(--rust)} .saldo.pos{color:var(--green)}
.figs .sub{font-size:12px;color:var(--ink-soft);text-align:right}
.bar{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:12px;color:var(--ink-soft)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card>h2 em{font-style:normal;font-family:"IBM Plex Sans";font-weight:500;font-size:12px;color:var(--ink-soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:"Bricolage Grotesque";font-size:20px;font-weight:700;letter-spacing:-.02em}
.stat small{font-size:12px;color:var(--ink-soft)}
.stat.in b{color:var(--green)} .stat.out b{color:var(--rust)}

.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.dot{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:11.5px;color:var(--ink-soft)}
.row .v{font-weight:600;font-size:14px;white-space:nowrap}
.row .v.in{color:var(--green)}
.del{background:none;border:0;padding:4px 2px 4px 6px;color:var(--ink-soft);font-size:15px;opacity:.6}
.clic{cursor:pointer;-webkit-tap-highlight-color:transparent}
.row.clic{cursor:pointer;-webkit-tap-highlight-color:transparent}
.row.clic:active{background:var(--surface-2);border-radius:8px}

.prog{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.prog span{display:block;height:100%;border-radius:4px}
.budget-row{padding:11px 0;border-top:1px solid var(--line)}
.budget-row:first-child{border-top:0}
.budget-head{display:flex;align-items:center;gap:9px;font-size:14px}
.budget-head .t{flex:1;font-weight:500}
.budget-head .n{font-size:12.5px;color:var(--ink-soft);font-weight:400}
.budget-head .n.over{color:var(--rust);font-weight:600}
.mini-in{width:104px;padding:7px 9px;font-size:14px;text-align:right}

/* cartão */
.cartao{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--surface);
  border-left:4px solid var(--line)}
.cartao .ch{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.cartao .ch b{flex:1;font-family:"Bricolage Grotesque";font-size:15px;font-weight:700}
.fatura{font-family:"Bricolage Grotesque";font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:normal}
.venc{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.venc.perto{color:var(--rust);font-weight:600}
.fut{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.fut .m{width:70px;color:var(--ink-soft);font-size:12.5px}
.fut .pb{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fut .pb span{display:block;height:100%}
.fut .pv{font-weight:600;width:86px;text-align:right}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 1px 10px;display:grid;gap:3px;justify-items:center;
  font-size:9.5px;color:var(--ink-soft)}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--ink);font-weight:600}
nav button[aria-current="true"] svg{stroke:var(--green)}

.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:54px;height:54px;
  border-radius:50%;border:0;background:var(--green);color:var(--on-green);font-size:27px;line-height:1;
  box-shadow:0 6px 18px rgba(23,33,27,.22);display:grid;place-items:center}

.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;display:none;max-width:640px;margin:0 auto}
.sheet.on{display:block}
.sheet h2{font-size:17px;margin-bottom:12px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
label{display:block;font-size:12px;color:var(--ink-soft);margin:11px 0 5px;font-weight:500}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--green);color:var(--green);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 11px;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.aviso{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ochre-soft);color:var(--ink);font-size:12.5px}
.primary{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--green);
  color:var(--on-green);font-weight:600;font-size:15px}
.primary[disabled]{opacity:.55}
.ghost{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;
  font-size:14px;color:var(--ink-soft)}
.empty{text-align:center;padding:26px 14px;color:var(--ink-soft);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:"Bricolage Grotesque";font-size:16px;margin-bottom:5px}
.tiny{font-size:12px;color:var(--ink-soft)}
.status{font-size:11px;color:var(--ink-soft);text-align:center;padding:4px 0 16px}
.hide{display:none}
/* ---- gráficos ---- */
:root{
  --graf-real:#9C3B2E;      /* despesa já realizada */
  --graf-prev:#2A6DB8;      /* despesa prevista (parcelas e fixos à frente) */
  --graf-grade:#D2D8C9;
}
@media (prefers-color-scheme:dark){
  :root{--graf-real:#CF7361;--graf-prev:#5A93D6;--graf-grade:#2F3A33}
}
.graf{width:100%;height:auto;display:block;overflow:visible;touch-action:manipulation}
.graf text{font-family:"IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.graf .hit{fill:transparent}
.tl-legenda{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
.tl-legenda span{display:flex;align-items:center;gap:5px}
.tl-legenda i{width:10px;height:10px;border-radius:2px;display:block}
.leitura{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.leitura .qual{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:14px}
.leitura .nums{font-size:13px;color:var(--ink-soft);margin-top:3px}
.leitura .nums b{color:var(--ink);font-weight:600}
.leitura .ir{margin-top:9px;padding:7px 12px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;font-size:12.5px;color:var(--ink-soft)}
.bar span{transition:opacity .12s}
.bar span.apagado{opacity:.3}
.budget-row.marcada{background:var(--surface-2);border-radius:10px;padding-left:7px;padding-right:7px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:999px;font-size:13px;z-index:50;display:none}
#toast.on{display:block}

.step:disabled{opacity:.35}
.chips.rolagem{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.rolagem::-webkit-scrollbar{display:none}
.chips.rolagem .chip{white-space:nowrap;flex:0 0 auto}
.busca{display:flex;gap:8px;align-items:center}
.busca input{flex:1}
.busca .chip{flex:0 0 auto;padding:11px 13px}
.flab{font-size:11px;color:var(--ink-soft);margin:10px 0 5px;font-weight:500}
.res-filtro{font-size:12.5px;color:var(--ink-soft);margin:0 2px 10px}
.ativos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ativos .chip{padding:6px 10px;font-size:12px;background:var(--surface-2)}
.mes-h{display:flex;justify-content:space-between;font-family:"Bricolage Grotesque";font-weight:700;font-size:15px;margin:16px 2px 8px;text-transform:capitalize}
.mes-h em{font-style:normal;font-weight:500;font-size:12px;color:var(--ink-soft);text-transform:none}
.link-suave{background:none;border:0;color:var(--ink-soft);font-size:13px;text-decoration:underline;padding:10px;display:block;margin:0 auto}

/* ---- gestos e animações (versão C) ---- */
html,body{overscroll-behavior:contain}
.sw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw .row{border-top:0;background:var(--surface);position:relative;transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.sw .row.arrasta{transition:none}
.sw .row.aberta{transform:translateX(-192px)}
.sw-acoes{position:absolute;right:0;top:0;bottom:0;display:flex}
.sw-acoes button{width:64px;border:0;color:#fff;font-size:12px;font-weight:600;padding:0}
.sw-acoes [data-sw="edit"]{background:#3C6E9F}
.sw-acoes [data-sw="dup"]{background:#1D6B4F}
.sw-acoes [data-sw="del"]{background:#9C3B2E}
#puxar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-70px);z-index:38;
  background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease;white-space:nowrap}
.sheet.on{animation:sobe .26s cubic-bezier(.2,.8,.2,1)}
.sheet.saindo{animation:desce .18s ease-in forwards}
.scrim.on{animation:aparece .2s ease-out}
.graf.anima path{transform-box:fill-box;transform-origin:50% 100%;animation:cresce .45s cubic-bezier(.2,.7,.2,1) both}
.bar.anima{animation:revela .5s ease-out both}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
@keyframes desce{to{transform:translateY(100%)}}
@keyframes aparece{from{opacity:0}}
@keyframes cresce{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes revela{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

.voltar{background:none;border:0;color:var(--ink-soft);font-size:14px;font-weight:500;padding:6px 2px;margin:0 0 6px;display:block}
.fat-topo .fatura{font-size:30px}

.sug{margin-top:7px}
.sug .chip{padding:6px 11px;font-size:13px;background:var(--surface-2)}

.proj-hero{margin:2px 0 4px}
.proj-hero .big{font-family:"Bricolage Grotesque";font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.proj-hero .big.neg{color:var(--rust)} .proj-hero .big.pos{color:var(--green)}
.proj-linha{font-size:13px;color:var(--ink-soft);margin:4px 0}
.proj-linha b{color:var(--ink);font-weight:600}
.proj-linha .ok{color:var(--green);font-weight:600} .proj-linha .mal{color:var(--rust);font-weight:600}
.proj-mes small{display:block;font-size:11.5px;color:var(--ink-soft)}
.row.prev .dot{border:1.5px dashed currentColor;background:transparent!important}
.sw-acoes.dois button{width:96px}
.prog.dupla{position:relative}
.prog.dupla span{position:absolute;left:0;top:0}
.prog.dupla span.pv{opacity:.35}
.two>div{min-width:0}
input[type=month],input[type=date]{min-width:0;max-width:100%}
.mini-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px 47px}

#carga{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;display:none;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--green),transparent) no-repeat;background-size:40% 100%;animation:carga 1.1s linear infinite}
#carga.on{display:block}
@keyframes carga{from{background-position:-40% 0}to{background-position:140% 0}}
</style>
</head>
<body>
<div id="carga" aria-hidden="true"></div>

<header>
  <div class="mhead">
    <button class="step" id="prev" aria-label="Mês anterior">&lsaquo;</button>
    <h1 id="mtitle">carregando<small id="msub"></small></h1>
    <button class="step" id="next" aria-label="Próximo mês">&rsaquo;</button>
  </div>
</header>

<main id="view"><div class="empty">Carregando sua planilha…</div></main>
<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav>
  <button data-tab="resumo" aria-current="true"><svg viewBox="0 0 24 24"><path d="M3 13h5v8H3zM10 3h5v18h-5zM17 9h4v12h-4z"/></svg>Resumo</button>
  <button data-tab="lanc"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Lanç.</button>
  <button data-tab="carteira"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>Carteira</button>
  <button data-tab="orc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Orçam.</button>
  <button data-tab="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg>Metas</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
/* ---------- conexão com o Apps Script ---------- */

const CFG = {
  url: localStorage.getItem('caixa_url') || '',
  token: localStorage.getItem('caixa_token') || ''
};
let offline = false;

/* nomes dos parâmetros de cada ação, para manter as chamadas posicionais */
const ARGS = {
  ping: [], getTudo: [],
  addLanc: ['itens'], updLanc: ['id', 'campos'], substituirLanc: ['id', 'grupo', 'itens'], delLanc: ['id', 'grupo'],
  salvarCartao: ['c'], delCartao: ['id'], salvarConta: ['c'], delConta: ['id'],
  salvarCategoria: ['c'], delCategoria: ['id', 'mover'],
  addPagamento: ['p'], delPagamento: ['id'],
  salvarRecorrente: ['r'], delRecorrente: ['id'],
  setOrc: ['catId', 'limite'], salvarPrefs: ['chave', 'valor'], addMeta: ['m'], updMeta: ['id', 'guardado'], delMeta: ['id']
};

let pendentes = 0;   // gravações em andamento
async function chamar(acao, args, cfg) {
  const escrita = acao !== 'getTudo' && acao !== 'ping';
  if (escrita) pendentes++;
  try { return await chamarBruto(acao, args, cfg); }
  finally { if (escrita) pendentes--; }
}
async function chamarBruto(acao, args, cfg) {
  const c = cfg || CFG;
  if (!c.url) throw new Error('Conexão não configurada.');
  if (navigator.onLine === false) throw new Error('Sem internet.');
  // text/plain evita o preflight OPTIONS, que o Apps Script não responde
  const r = await fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: c.token, acao: acao, args: args || {} }),
    redirect: 'follow'
  });
  if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '.');
  let j;
  try { j = await r.json(); }
  catch (e) { throw new Error('Resposta inesperada — confira se a implantação está como "Qualquer pessoa".'); }
  if (j.erro) throw new Error(j.erro);
  return j.dados;
}

const api = (fn, ...vals) =>
  chamar(fn, (ARGS[fn] || []).reduce((o, k, i) => { o[k] = vals[i]; return o; }, {}));

let D = { lanc: [], cats: [], cartoes: [], contas: [], pagamentos: [], orcs: {}, metas: [], prefs: {}, recs: [] };
let cursor = new Date(), tab = 'resumo';

const MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mk = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const brl = n => (n < 0 ? '-' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const brlNum = n => Number(n).toFixed(2).replace('.', ',');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const cat = id => D.cats.find(c => c.id === id) || {id:'outros', nome:'Outros', icone:'•', cor:'#6B776D'};
const cartao = id => D.cartoes.find(c => c.id === id) || null;
const conta = id => D.contas.find(c => c.id === id) || null;
/** Recorrentes: lista vazia se o Code.gs ainda é o antigo (aí D.recs não existe). */
const recs = () => Array.isArray(D.recs) ? D.recs : [];
const backendNovo = () => Array.isArray(D.recs);
function exigeBackend() {
  if (backendNovo()) return false;
  alert('Para usar este recurso, atualize o Code.gs no Apps Script (cole o arquivo novo) e reimplante em "Gerenciar implantações → Nova versão". Depois puxe a tela para atualizar.');
  return true;
}
/** Só receita e despesa entram em "entrou", "saiu" e na sobra. Transferência e ajuste só movem saldo. */
const efeito = t => t.tipo === 'receita' ? t.valor : t.tipo === 'despesa' ? -t.valor : 0;
const ehReserva = id => { const c = conta(id); return !!(c && c.reserva); };
/** Lançamento sem conta definida pertence à primeira conta cadastrada. */
const contaDe = t => t.conta && conta(t.conta) ? t.conta : (D.contas[0] || {}).id;
/** Lê o campo de valor: aceita "1.234,56", "45,90" e contas como "35,40+12,90" ou "199*3". */
function num(txt) {
  let s = String(txt || '').trim();
  if (!s) return NaN;
  s = s.replace(/[R$\s]/g, '');
  // 1.234,56 -> 1234.56  |  45,90 -> 45.90
  if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(/,/g, '.');
  if (!/^[0-9.+\-*/()]+$/.test(s)) return NaN;
  try {
    const v = Function('"use strict";return (' + s + ')')();
    return (typeof v === 'number' && isFinite(v)) ? Math.round(v * 100) / 100 : NaN;
  } catch (e) { return NaN; }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const doMes = k => D.lanc.filter(t => t.comp === k);
const somaMes = k => { let r=0,d=0; doMes(k).forEach(t => { if (t.tipo==='receita') r+=t.valor; else if (t.tipo==='despesa') d+=t.valor; }); return {rec:r, des:d, saldo:r-d}; };

/** Em que fatura cai uma compra feita em `dataISO` neste cartão, e qual o vencimento dela. */
function competenciaCartao(c, dataISO, somaMeses) {
  const p = dataISO.split('-').map(Number);
  let ano = p[0], m = p[1] - 1, dia = p[2];
  if (dia >= c.fechamento) m += 1;                  // no dia do fechamento já entra na próxima
  if (c.vencimento <= c.fechamento) m += 1;         // vence no mês seguinte ao fechamento
  m += (somaMeses || 0);
  const d = new Date(ano, m, 1);
  return mk(d);
}
const vencimentoDe = (c, comp) => comp + '-' + String(c.vencimento).padStart(2, '0');

/** Dia em que a fatura passa a receber compras (e pode ser paga): o fechamento da fatura anterior. */
function aberturaDe(c, comp) {
  const p = comp.split('-').map(Number);
  const mesFecha = (p[1] - 1) - (c.vencimento <= c.fechamento ? 1 : 0);   // mês em que ela fecha
  const m = mesFecha - 1;                                                  // abriu no fechamento do mês anterior
  const ult = new Date(p[0], m + 1, 0).getDate();
  const d = new Date(p[0], m, Math.min(c.fechamento, ult));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/** Soma meses a uma competência AAAA-MM. */
function somaComp(comp, meses) {
  const p = comp.split('-').map(Number);
  return mk(new Date(p[0], p[1] - 1 + (meses || 0), 1));
}

/** Fatura de um cartão numa competência: o que foi lançado. */
const fatura = (cartaoId, comp) =>
  D.lanc.filter(t => t.cartao === cartaoId && t.comp === comp && t.tipo === 'despesa')
        .reduce((s, t) => s + t.valor, 0);

/** O que já foi pago dessa fatura. */
const pagoDa = (cartaoId, comp) =>
  D.pagamentos.filter(p => p.cartao === cartaoId && p.comp === comp)
              .reduce((s, p) => s + p.valor, 0);

/** Situação da fatura: quanto falta e em que estado está. */
function situacao(c, comp) {
  const total = fatura(c.id, comp), pago = pagoDa(c.id, comp);
  const resta = Math.round((total - pago) * 100) / 100;
  const venc = vencimentoDe(c, comp), hoje = hojeISO();
  let estado, cor;
  if (total === 0) { estado = 'sem lançamentos'; cor = 'var(--ink-soft)'; }
  else if (resta <= 0.009) { estado = 'paga'; cor = 'var(--green)'; }
  else if (pago > 0 && venc >= hoje) { estado = 'paga em parte'; cor = 'var(--ochre)'; }
  else if (pago > 0) { estado = 'paga em parte · vencida'; cor = 'var(--rust)'; }
  else if (venc < hoje) { estado = 'vencida e não paga'; cor = 'var(--rust)'; }
  else { estado = 'em aberto'; cor = 'var(--ink-soft)'; }
  const abre = aberturaDe(c, comp);
  return { total: total, pago: pago, resta: resta, venc: venc, estado: estado, cor: cor, abre: abre, pagavel: abre <= hoje };
}

/** Limite comprometido: tudo que foi lançado no cartão menos tudo que já foi pago. */
function usado(cartaoId) {
  const gasto = D.lanc.filter(t => t.cartao === cartaoId && t.tipo === 'despesa').reduce((s, t) => s + t.valor, 0);
  const pago = D.pagamentos.filter(p => p.cartao === cartaoId).reduce((s, p) => s + p.valor, 0);
  return Math.max(0, gasto - pago);
}

/** Saldo da conta: inicial + tudo que já aconteceu até hoje. */
function saldoConta(contaId) {
  const c = conta(contaId); if (!c) return 0;
  const hoje = hojeISO();
  let s = c.inicial;

  // Pix, débito e dinheiro entram e saem da conta na própria data
  D.lanc.forEach(t => {
    if (!t.data || t.data > hoje) return;
    if (t.tipo === 'transf') {                // transferência: sai de uma conta e entra na outra
      if (contaDe(t) === contaId) s -= t.valor;
      if (t.destino === contaId) s += t.valor;
      return;
    }
    if (t.meio === 'cartao') return;          // cartão sai via pagamento de fatura
    if (contaDe(t) !== contaId) return;
    s += (t.tipo === 'receita' || t.tipo === 'ajuste') ? t.valor : -t.valor;   // ajuste já vem com sinal
  });

  // pagamentos de fatura saem na data em que você pagou
  D.pagamentos.forEach(p => {
    const cId = p.conta && conta(p.conta) ? p.conta : (D.contas[0] || {}).id;
    if (cId !== contaId) return;
    if (!p.data || p.data > hoje) return;
    s -= p.valor;
  });

  return s;
}

const vib = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
const reduzMovimento = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

function toast(msg) {
  vib(/^(Erro|Falhou|Não|Sem|Offline)/.test(msg) ? [30, 50, 30] : 12);
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), msg.length > 40 ? 3800 : 2200);
}

const carga = on => { const e = document.getElementById('carga'); if (e) e.classList.toggle('on', !!on); };
let tempoCarga = null, cargaEm = null;   // quanto durou a última busca e quando

async function carregar() {
  // mostra o que já tem guardado, para abrir instantâneo e funcionar offline
  const cache = localStorage.getItem('caixa_dados');
  if (cache) { try { D = JSON.parse(cache); render(); } catch (e) {} }

  carga(true);
  const t0 = Date.now();
  try {
    D = await api('getTudo');
    tempoCarga = Date.now() - t0; cargaEm = new Date();
    offline = false;
    salvarCache();
    render();
  } catch (e) {
    offline = true;
    if (cache) { render(); toast('Offline — mostrando os dados guardados'); }
    else {
      document.getElementById('view').innerHTML =
        '<div class="card"><div class="empty"><b>Não consegui conectar</b>' + esc(e.message || e) +
        '</div><button class="ghost" id="reconfig">Rever a conexão</button></div>';
      const b = document.getElementById('reconfig'); if (b) b.onclick = () => telaConexao();
    }

}

/* ---------- gráficos que respondem ao toque ---------- */

let animarGraf = true;   // gráfico e barra crescem ao entrar na tela ou trocar de mês
let selMes = null;   // mês selecionado na linha do tempo
let selCat = null;   // categoria selecionada na barra de composição

const mesCurto = d => MES[d.getMonth()].slice(0, 3);
const semCents = n => Math.round(n).toLocaleString('pt-BR');

/** Linha do tempo de despesas: 5 meses atrás, o mês visto e 6 à frente. */
function linhaDoTempo(k) {
  const hojeMes = mk(new Date());
  const ms = [];
  for (let i = -5; i <= 6; i++) {
    const d = new Date(cursor.getFullYear(), cursor.getMonth() + i, 1);
    const kk = mk(d);
    const s = somaMes(kk);
    ms.push({ k: kk, d: d, rec: s.rec, des: s.des, saldo: s.saldo, futuro: kk > hojeMes });
  }
  if (!ms.some(m => m.des > 0)) return '';

  const sel = ms.find(m => m.k === (selMes || k)) || ms.find(m => m.k === k);
  const max = Math.max(...ms.map(m => m.des));

  const W = 360, H = 180, padL = 4, padR = 4, padT = 34, padB = 28;
  const alt = H - padT - padB;
  const slot = (W - padL - padR) / ms.length;
  const larg = Math.min(20, slot - 8);
  const base = padT + alt;
  const y = v => base - (max ? (v / max) * alt : 0);

  // topo arredondado, pé quadrado
  function coluna(x, v, cor) {
    const h = base - y(v);
    if (h <= 0.5) return '';
    const r = Math.min(4, h / 2);
    return '<path d="M' + x + ',' + base + ' V' + (y(v) + r) +
      ' Q' + x + ',' + y(v) + ' ' + (x + r) + ',' + y(v) +
      ' H' + (x + larg - r) + ' Q' + (x + larg) + ',' + y(v) + ' ' + (x + larg) + ',' + (y(v) + r) +
      ' V' + base + ' Z" fill="' + cor + '"/>';
  }

  let svg = '';

  // grade: uma hairline no máximo, com o valor
  svg += '<line x1="' + padL + '" y1="' + y(max) + '" x2="' + (W - padR) + '" y2="' + y(max) +
    '" stroke="var(--graf-grade)" stroke-width="1"/>';
  if (!sel || Math.abs(sel.des - max) > 0.5) {
    svg += '<text x="' + padL + '" y="12" font-size="9.5" fill="var(--ink-soft)">máx R$ ' + semCents(max) + '</text>';
  }
  svg += '<line x1="' + padL + '" y1="' + base + '" x2="' + (W - padR) + '" y2="' + base +
    '" stroke="var(--graf-grade)" stroke-width="1"/>';

  // divisória do mês corrente
  const iHoje = ms.findIndex(m => m.k === hojeMes);
  if (iHoje > -1 && iHoje < ms.length - 1) {
    const xd = padL + (iHoje + 1) * slot;
    svg += '<line x1="' + xd + '" y1="' + (padT - 16) + '" x2="' + xd + '" y2="' + (base + 5) +
      '" stroke="var(--ink-soft)" stroke-width="1"/>';
    svg += '<text x="' + xd + '" y="12" font-size="8.5" text-anchor="middle" fill="var(--ink-soft)">hoje</text>';
  }

  ms.forEach((m, i) => {
    const x = padL + i * slot + (slot - larg) / 2;
    svg += coluna(x, m.des, m.futuro ? 'var(--graf-prev)' : 'var(--graf-real)');

    // rótulo do mês
    svg += '<text x="' + (x + larg / 2) + '" y="' + (base + 13) + '" font-size="8.5" text-anchor="middle" fill="var(--ink-soft)">' +
      mesCurto(m.d) + '</text>';
    if (m.d.getMonth() === 0) {
      svg += '<text x="' + (x + larg / 2) + '" y="' + (base + 23) + '" font-size="8" text-anchor="middle" fill="var(--ink-soft)">' +
        String(m.d.getFullYear()).slice(2) + '</text>';
    }

    // só o mês selecionado recebe rótulo de valor e marca no eixo
    if (sel && m.k === sel.k) {
      if (m.des > 0) {
        svg += '<text x="' + (x + larg / 2) + '" y="' + (y(m.des) - 6) + '" font-size="10.5" font-weight="600" ' +
          'text-anchor="middle" fill="var(--ink)">' + semCents(m.des) + '</text>';
      }
      svg += '<rect x="' + x + '" y="' + (base + 2) + '" width="' + larg + '" height="3" rx="1.5" fill="var(--ink)"/>';
    }

    // área de toque: o vão inteiro, não só a coluna pintada
    svg += '<rect class="hit" data-mes="' + m.k + '" x="' + (padL + i * slot) + '" y="' + (padT - 12) +
      '" width="' + slot + '" height="' + (alt + 24) + '"/>';
  });

  let leitura = '';
  if (sel) {
    const nome = MES[sel.d.getMonth()] + ' ' + sel.d.getFullYear();
    leitura = '<div class="leitura"><div class="qual">' + nome + (sel.futuro ? ' · previsto' : '') + '</div>' +
      '<div class="nums">entrou <b>' + brl(sel.rec) + '</b> · saiu <b>' + brl(sel.des) + '</b> · sobra <b>' + brl(sel.saldo) + '</b></div>' +
      (sel.k !== k ? '<button class="ir" data-ir="' + sel.k + '">Abrir ' + MES[sel.d.getMonth()] + '</button>' : '') +
      '</div>';
  }

  return '<div class="card"><h2>Despesas mês a mês <em>toque numa coluna</em></h2>' +
    '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="Despesas por mês, de ' + mesCurto(ms[0].d) + ' a ' + mesCurto(ms[ms.length-1].d) + '">' + svg + '</svg>' +
    '<div class="tl-legenda"><span><i style="background:var(--graf-real)"></i>realizado</span>' +
    '<span><i style="background:var(--graf-prev)"></i>previsto</span></div>' +
    leitura + '</div>';
}

const BLOCOS = [
  { id: 'sobra',      nome: 'Sobra do mês' },
  { id: 'fluxo',      nome: 'Entrou e saiu' },
  { id: 'forma',      nome: 'À vista e cartão' },
  { id: 'confirmar',  nome: 'A confirmar (recorrentes previstos)' },
  { id: 'faturas',    nome: 'Faturas em aberto' },
  { id: 'orcamento',  nome: 'Orçamento do mês (avisos de limite)' },
  { id: 'projecao',   nome: 'Projeção do saldo e gasto por dia' },
  { id: 'grafico',    nome: 'Despesas mês a mês' },
  { id: 'saldo',      nome: 'Saldo em conta' },
  { id: 'categorias', nome: 'Por categoria' }
];

/** Ordem e visibilidade salvas; blocos novos entram no fim, os que sumiram são ignorados. */
function painel() {
  let p = {};
  try { p = JSON.parse((D.prefs || {}).painel || '{}') || {}; } catch (e) {}
  const ids = BLOCOS.map(b => b.id);
  const ordem = (p.ordem || []).filter(i => ids.includes(i));
  ids.forEach((i, pos) => {
    if (ordem.includes(i)) return;
    // bloco novo entra logo depois do que o antecede no padrão, não perdido no fim da lista
    let ant = pos - 1; while (ant >= 0 && !ordem.includes(ids[ant])) ant--;
    ordem.splice(ant >= 0 ? ordem.indexOf(ids[ant]) + 1 : 0, 0, i);
  });
  return { ordem: ordem, off: (p.off || []).filter(i => ids.includes(i)) };
}

let tPrefs = null;
function salvarPainel(p) {
  D.prefs = D.prefs || {};
  D.prefs.painel = JSON.stringify(p);
  render();
  salvarCache();
  clearTimeout(tPrefs);   // só a última escolha vai à planilha
  tPrefs = setTimeout(async () => {
    try { await api('salvarPrefs', 'painel', D.prefs.painel); }
    catch (e) { toast('Não salvou o painel na planilha'); }
  }, 500);
}

function sheetPainel() {
  const p = painel();
  const n = p.ordem.length;
  openSheet('<h2>Personalizar painel</h2>' +
    '<div class="aviso" style="margin:0 0 6px">Desligue o que não quer ver e use as setas para mudar a ordem. Fica salvo na sua planilha.</div>' +
    p.ordem.map((id, i) => {
      const on = !p.off.includes(id), b = BLOCOS.find(x => x.id === id);
      return '<div class="row"><button class="chip" data-pon="' + id + '" aria-pressed="' + on + '" style="min-width:74px">' +
        (on ? 'visível' : 'oculto') + '</button>' +
        '<span class="t"><b style="white-space:normal">' + esc(b.nome) + '</b></span>' +
        '<button class="step" data-pup="' + id + '" aria-label="Subir"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="step" data-pdn="' + id + '" aria-label="Descer"' + (i === n - 1 ? ' disabled' : '') + '>↓</button></div>';
    }).join('') +
    '<button class="ghost" id="p-padrao">Restaurar padrão</button>' +
    '<button class="primary" id="p-ok">Pronto</button>');

  const salva = np => { salvarPainel(np); sheetPainel(); };
  sheet.querySelectorAll('[data-pon]').forEach(b => b.onclick = () => {
    const q = painel(), id = b.dataset.pon;
    q.off = q.off.includes(id) ? q.off.filter(x => x !== id) : q.off.concat(id);
    salva(q);
  });
  const move = (id, d) => {
    const q = painel(), i = q.ordem.indexOf(id), j = i + d;
    if (j < 0 || j >= q.ordem.length) return;
    q.ordem.splice(j, 0, q.ordem.splice(i, 1)[0]);
    salva(q);
  };
  sheet.querySelectorAll('[data-pup]').forEach(b => b.onclick = () => move(b.dataset.pup, -1));
  sheet.querySelectorAll('[data-pdn]').forEach(b => b.onclick = () => move(b.dataset.pdn, 1));
  document.getElementById('p-padrao').onclick = () => salva({ ordem: BLOCOS.map(b => b.id), off: [] });
  document.getElementById('p-ok').onclick = closeSheet;
}

/* ---------- recorrentes: previstos a confirmar ---------- */

const diaPrevisto = (r, mm) => {
  const p = mm.split('-').map(Number), ult = new Date(p[0], p[1], 0).getDate();
  return mm + '-' + String(Math.min(r.dia, ult)).padStart(2, '0');
};

/** Ocorrências ainda não confirmadas nem puladas, mês do calendário de `de` até `ate` (AAAA-MM). */
function ocorrencias(de, ate) {
  const feitos = new Set();
  D.lanc.forEach(t => { if (t.rec) feitos.add(t.rec); });
  const out = [];
  recs().forEach(r => {
    if (!r.ativo) return;
    let mm = r.inicio && r.inicio > de ? r.inicio : de;
    for (; mm <= ate; mm = somaComp(mm, 1)) {
      if (r.fim && mm > r.fim) break;
      const key = r.id + '|' + mm;
      if (feitos.has(key) || r.pulados.indexOf(mm) >= 0) continue;
      const data = diaPrevisto(r, mm);
      const c = r.meio === 'cartao' && r.cartao ? cartao(r.cartao) : null;
      out.push({ key: key, rid: r.id, mm: mm, data: data, comp: c ? competenciaCartao(c, data) : mm,
        desc: r.desc, valor: r.valor, tipo: r.tipo, catId: r.catId, meio: r.meio, cartao: r.cartao,
        conta: r.conta, fixo: r.fixo, previsto: true });
    }
  });
  return out;
}
/** Previstos cuja competência é o mês `k` (o mesmo critério dos lançamentos). */
const previstosDoMes = k => ocorrencias(somaComp(k, -3), k).filter(o => o.comp === k);
/** Mês corrente: inclui o que ficou para trás sem confirmar. */
function previstosView(k) {
  const m = mk(new Date());
  let l = previstosDoMes(k);
  if (k === m) l = ocorrencias(somaComp(m, -12), somaComp(m, -1)).filter(o => o.comp < m).concat(l);
  return l.sort((a, b) => a.data.localeCompare(b.data));
}

function linhasPrevistos(l) {
  const hoje = hojeISO();
  return l.map(o => {
    const c = cat(o.catId), cc = o.meio === 'cartao' && o.cartao ? cartao(o.cartao) : null;
    const via = cc ? cc.nome : (o.meio === 'pix' ? 'Pix' : o.meio === 'debito' ? 'Débito' : 'Dinheiro');
    const dd = o.data.slice(8) + '/' + o.data.slice(5, 7);
    const quando = o.data < hoje ? '<span style="color:var(--rust)">atrasado · dia ' + dd + '</span>' : o.data === hoje ? 'hoje' : 'dia ' + dd;
    return '<div class="row clic prev" data-conf="' + esc(o.key) + '"><span class="dot" style="color:' + c.cor + '">' + c.icone + '</span>' +
      '<span class="t"><b>' + esc(o.desc) + '</b><small>previsto ' + quando + ' · ' + esc(via) + '</small></span>' +
      '<span class="v ' + (o.tipo === 'receita' ? 'in' : '') + '">' + (o.tipo === 'receita' ? '+' : '') + brl(o.valor) + '</span>' +
      '<span class="del" aria-hidden="true">&rsaquo;</span></div>';
  }).join('');
}

function acharPrevisto(key) {
  const mm = key.slice(key.lastIndexOf('|') + 1);
  return ocorrencias(mm, mm).find(o => o.key === key) || null;
}
function confirmarPrevisto(key) {
  const o = acharPrevisto(key);
  if (!o) { toast('Esse previsto já foi tratado'); render(); return; }
  sheetLanc(null, { tipo: o.tipo, catId: o.catId, meio: o.meio, cartao: o.cartao, conta: o.conta, desc: o.desc,
    valor: o.valor, data: o.data, dataFixa: o.data, rec: o.key, fixo: o.fixo, rid: o.rid, mm: o.mm });
}
async function pularPrevisto(rid, mm) {
  const r = recs().find(x => x.id === rid); if (!r) return;
  r.pulados = r.pulados.concat(mm);
  closeSheet(); render();
  try { await api('salvarRecorrente', r); toast('Pulado neste mês'); }
  catch (e) { toast('Falhou ao salvar'); carregar(); }
}

/* ---------- orçamento: limites por categoria ---------- */

/** Para cada categoria com limite: gasto real, previstos a confirmar e em que nível está. */
function orcResumo(comp) {
  const g = {}, pv = {};
  D.lanc.forEach(t => { if (t.tipo === 'despesa' && t.comp === comp) g[t.catId] = (g[t.catId] || 0) + t.valor; });
  previstosDoMes(comp).forEach(o => { if (o.tipo === 'despesa') pv[o.catId] = (pv[o.catId] || 0) + o.valor; });
  return Object.keys(D.orcs || {}).filter(id => D.orcs[id] > 0 && D.cats.some(c => c.id === id && !c.receita)).map(id => {
    const teto = D.orcs[id], gasto = g[id] || 0, prev = pv[id] || 0;
    const pct = gasto / teto, pctProj = (gasto + prev) / teto;
    const nivel = gasto > teto + 0.004 ? 'estourou' : (gasto + prev) > teto + 0.004 ? 'vai' : pct >= 0.8 ? 'perto' : 'ok';
    return { id: id, teto: teto, gasto: gasto, prev: prev, pct: pct, pctProj: pctProj, nivel: nivel };
  });
}
/** Texto curto de alerta para a categoria no mês, ou '' se está tranquilo. */
function avisoOrc(catId, comp) {
  const x = orcResumo(comp).find(y => y.id === catId);
  if (!x || x.nivel === 'ok') return '';
  const nome = cat(catId).nome;
  return x.nivel === 'estourou' ? '⚠ ' + nome + ' passou do limite em ' + brl(x.gasto - x.teto)
    : x.nivel === 'vai' ? '⚠ ' + nome + ': com os previstos, passa do limite'
    : '⚠ ' + nome + ' em ' + Math.round(x.pct * 100) + '% do limite';
}
/** Primeiro alerta entre os lançamentos que acabaram de ser salvos. */
function avisoOrcItens(itens) {
  const vistos = {};
  for (let i = 0; i < itens.length; i++) {
    const t = itens[i];
    if (t.tipo !== 'despesa') continue;
    const k2 = t.catId + '|' + t.comp;
    if (vistos[k2]) continue; vistos[k2] = 1;
    const a = avisoOrc(t.catId, t.comp);
    if (a) return ' · ' + a;
  }
  return '';
}

function blocoOrcamento(k) {
  const l = orcResumo(k);
  if (!l.length) return '';
  const totT = l.reduce((s2, x) => s2 + x.teto, 0), totG = l.reduce((s2, x) => s2 + x.gasto, 0), totP = l.reduce((s2, x) => s2 + x.prev, 0);
  const risco = l.filter(x => x.nivel !== 'ok').sort((a, b) => b.pctProj - a.pctProj);
  const barra = (x, cor) => '<div class="prog dupla"><span class="pv" style="width:' + Math.min(100, x.pctProj * 100) + '%;background:' + cor + '"></span>' +
    '<span style="width:' + Math.min(100, x.pct * 100) + '%;background:' + cor + '"></span></div>';
  const corN = n => n === 'estourou' ? 'var(--rust)' : (n === 'vai' || n === 'perto') ? 'var(--ochre)' : 'var(--green)';
  return '<div class="card"><h2>Orçamento do mês <em>' + brl(totG) + ' de ' + brl(totT) + '</em></h2>' +
    barra({ pct: totG / totT, pctProj: (totG + totP) / totT }, totG > totT ? 'var(--rust)' : 'var(--green)') +
    (totP > 0 ? '<p class="tiny" style="margin:8px 0 0">+ ' + brl(totP) + ' em previstos a confirmar nas categorias com limite (parte clara da barra).</p>' : '') +
    (risco.length ? risco.map(x => {
      const c = cat(x.id);
      const txt = x.nivel === 'estourou' ? 'passou ' + brl(x.gasto - x.teto) + ' do limite'
        : x.nivel === 'vai' ? 'passa do limite com os previstos'
        : Math.round(x.pct * 100) + '% do limite · sobram ' + brl(x.teto - x.gasto);
      return '<div class="budget-row clic" data-irtab="orc"><div class="budget-head">' +
        '<span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">' + c.icone + '</span>' +
        '<span class="t">' + esc(c.nome) + '<br><span class="n ' + (x.nivel === 'estourou' ? 'over' : '') + '">' + txt + '</span></span>' +
        '<span class="n ' + (x.nivel === 'estourou' ? 'over' : '') + '">' + brl(x.gasto) + ' / ' + brl(x.teto) + '</span></div>' + barra(x, corN(x.nivel)) + '</div>';
    }).join('') : '<p class="tiny" style="margin:8px 0 0">Nenhuma categoria perto do limite. Tudo sob controle.</p>') +
    '<button class="ghost" data-irtab="orc" style="margin-top:10px">Ver e editar limites</button></div>';
}

/* ---------- projeção do saldo e gasto por dia ---------- */

const colchaoAtual = () => Math.max(0, Number((D.prefs || {}).colchao) || 0);
const r2 = n => Math.round(n * 100) / 100;

/** Saldo previsto no fim de cada um dos próximos 6 meses (mês atual + 5) e quanto dá para gastar por dia. */
function projecao() {
  const hoje = hojeISO(), mAtual = hoje.slice(0, 7), colchao = colchaoAtual();
  const saldo0 = D.contas.filter(c => !c.reserva).reduce((s2, c) => s2 + saldoConta(c.id), 0);   // reserva fica de fora

  // tudo que ainda vai mexer na conta, com a data em que mexe
  const ev = [];
  D.lanc.forEach(t => {
    if (!t.data || t.data <= hoje) return;
    if (t.tipo === 'transf') {                                          // só pesa se cruzar a fronteira da reserva
      const d = (t.destino && conta(t.destino) && !ehReserva(t.destino) ? t.valor : 0) - (!ehReserva(contaDe(t)) ? t.valor : 0);
      if (d) ev.push({ d: t.data, v: d });
      return;
    }
    if (t.tipo === 'ajuste') { if (!ehReserva(contaDe(t))) ev.push({ d: t.data, v: t.valor }); return; }
    if (t.meio === 'cartao') return;                                    // cartão sai só quando a fatura é paga
    if (ehReserva(contaDe(t))) return;
    ev.push({ d: t.data, v: t.tipo === 'receita' ? t.valor : -t.valor });
  });
  D.pagamentos.forEach(p => { if (p.data && p.data > hoje) ev.push({ d: p.data, v: -p.valor }); });
  let vencidas = 0;
  D.cartoes.forEach(c => {
    new Set(D.lanc.filter(t => t.cartao === c.id && t.tipo === 'despesa').map(t => t.comp)).forEach(cp => {
      const st = situacao(c, cp);
      if (st.resta <= 0.009) return;
      if (st.venc < hoje) vencidas += st.resta;                        // já venceu: conta como saída imediata
      ev.push({ d: st.venc < hoje ? hoje : st.venc, v: -st.resta });
    });
  });

  // recorrentes previstos: despesa atrasada conta como saída; receita só depois de confirmada
  let prevN = 0, prevSai = 0, prevEntra = 0;
  ocorrencias(somaComp(mAtual, -12), somaComp(mAtual, 5)).forEach(o => {
    if (o.conta && ehReserva(o.conta)) return;
    const c = o.meio === 'cartao' && o.cartao ? cartao(o.cartao) : null;
    if (o.tipo === 'despesa') {
      const quando = c ? vencimentoDe(c, o.comp) : o.data;
      ev.push({ d: quando < hoje ? hoje : quando, v: -o.valor }); prevN++; prevSai += o.valor;
    } else if (o.data > hoje) { ev.push({ d: o.data, v: o.valor }); prevN++; prevEntra += o.valor; }
  });

  const fimDe = k => k + '-' + String(new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)), 0).getDate()).padStart(2, '0');
  const meses = []; let acum = saldo0, ant = '';
  for (let i = 0; i < 6; i++) {
    const k = somaComp(mAtual, i), fim = fimDe(k);
    let entra = 0, sai = 0;
    ev.forEach(e => { if (e.d <= fim && (i === 0 || e.d > ant)) { if (e.v > 0) entra += e.v; else sai -= e.v; } });
    acum = r2(acum + entra - sai);
    meses.push({ k: k, entra: r2(entra), sai: r2(sai), saldo: acum });
    ant = fim;
  }

  // mês atual: quanto dá para gastar por dia à vista e ficar acima do colchão
  const m0 = meses[0];
  const diaHoje = Number(hoje.slice(8)), ultimo = Number(fimDe(mAtual).slice(8));
  const dias = ultimo - diaHoje + 1;                                   // hoje conta como um dia que ainda resta
  const aVista = D.lanc.filter(t => t.meio !== 'cartao' && t.tipo === 'despesa');
  const gastoHoje = r2(aVista.filter(t => t.data === hoje).reduce((s2, t) => s2 + t.valor, 0));
  const folga = r2(m0.saldo - colchao);                                // o que sobra para gastar, além do colchão
  const porDia = folga >= 0 ? r2((folga + gastoHoje) / dias) : 0;
  const restaHoje = folga >= 0 ? r2(porDia - gastoHoje) : 0;
  // ritmo: gasto à vista do mês, sem contas fixas (aluguel e afins distorcem a média)
  const gastoMes = aVista.filter(t => !t.fixo && t.data >= mAtual + '-01' && t.data <= hoje).reduce((s2, t) => s2 + t.valor, 0);
  const ritmoBruto = gastoMes / diaHoje, ritmo = r2(ritmoBruto);
  const estFinal = r2(m0.saldo - Math.max(0, ritmoBruto * dias - gastoHoje));
  const noCartao = r2(D.lanc.filter(t => t.meio === 'cartao' && t.tipo === 'despesa' && t.data.slice(0, 7) === mAtual).reduce((s2, t) => s2 + t.valor, 0));

  return { saldo0: saldo0, meses: meses, colchao: colchao, dias: dias, folga: folga, porDia: porDia, restaHoje: restaHoje,
           gastoHoje: gastoHoje, ritmo: ritmo, estFinal: estFinal, noCartao: noCartao, vencidas: r2(vencidas), ultimo: ultimo,
           prevN: prevN, prevSai: r2(prevSai), prevEntra: r2(prevEntra) };
}

function blocoProjecao() {
  if (!D.contas.length) return '';
  const p = projecao(), m0 = p.meses[0];
  const cor = v => v < 0 ? 'var(--rust)' : v < p.colchao ? 'var(--ochre)' : 'inherit';
  const hero = p.folga < 0
    ? '<div class="proj-hero"><div class="big neg">faltam ' + brl(-p.folga) + '</div>' +
      '<div class="proj-linha">Mesmo sem nenhum gasto novo, o saldo previsto no fim do mês (' + brl(m0.saldo) + ') fica ' +
      (p.colchao > 0 ? 'abaixo do colchão de ' + brl(p.colchao) : 'negativo') + '.</div></div>'
    : '<div class="proj-hero"><div class="big pos">' + brl(p.porDia) + '</div>' +
      '<div class="proj-linha"><b>pode gastar por dia</b> à vista (Pix, débito, dinheiro), nos ' + p.dias + ' dia' + (p.dias === 1 ? '' : 's') +
      ' que restam em ' + MES[Number(m0.k.slice(5)) - 1] + ', hoje incluído.</div></div>';
  const hoje = p.folga < 0 ? '' :
    '<div class="proj-linha">' + (p.restaHoje >= 0
      ? 'Hoje ainda pode gastar <b>' + brl(p.restaHoje) + '</b>' + (p.gastoHoje > 0 ? ' (já gastou ' + brl(p.gastoHoje) + ')' : '')
      : '<span class="mal">Hoje já passou ' + brl(-p.restaHoje) + ' do limite</span> (gastou ' + brl(p.gastoHoje) + ')') + '.</div>';
  const ritmo = p.ritmo > 0
    ? '<div class="proj-linha">Seu ritmo à vista é de <b>' + brl(p.ritmo) + '</b> por dia (sem contas fixas). Nesse ritmo você termina o mês com <span class="' +
      (p.estFinal >= p.colchao ? 'ok' : 'mal') + '">' + brl(p.estFinal) + '</span>.</div>'
    : '<div class="proj-linha">Ainda sem gastos à vista variáveis neste mês.</div>';
  return '<div class="card"><h2>Projeção do saldo <em>a partir de hoje</em></h2>' + hero + hoje + ritmo +
    '<div class="proj-linha">No cartão este mês: <b>' + brl(p.noCartao) + '</b> — pesa nas próximas faturas, não no caixa de agora.</div>' +
    (p.prevN > 0 ? '<div class="proj-linha">Inclui <b>' + p.prevN + '</b> recorrente' + (p.prevN === 1 ? '' : 's') + ' previsto' + (p.prevN === 1 ? '' : 's') +
      ' nos próximos 6 meses, ainda não confirmado' + (p.prevN === 1 ? '' : 's') + ': saídas ' + brl(p.prevSai) + (p.prevEntra > 0 ? ' · entradas ' + brl(p.prevEntra) : '') + '.</div>' : '') +
    (p.vencidas > 0 ? '<div class="proj-linha"><span class="mal">Inclui ' + brl(p.vencidas) + ' de faturas vencidas e não pagas.</span></div>' : '') +
    '<div style="margin-top:8px">' + p.meses.map((m, i) => {
      const d = m.k.split('-');
      return '<div class="row proj-mes"><span class="t"><b>' + rotuloComp(m.k) + (i === 0 ? ' · fim do mês' : '') + '</b>' +
        '<small>entra ' + brl(m.entra) + ' · sai ' + brl(m.sai) + '</small></span>' +
        '<span class="v" style="color:' + cor(m.saldo) + '">' + brl(m.saldo) + '</span></div>';
    }).join('') + '</div>' +
    '<p class="tiny" style="margin:8px 0 0">Considera o saldo de hoje (contas de reserva ficam de fora), o que já está lançado com data futura, as faturas a pagar e os recorrentes previstos. ' +
    'Recorrente atrasado conta como saída; receita prevista só entra depois de confirmada. O que não está lançado nem cadastrado não entra na conta.</p>' +
    '<button class="ghost" id="colchao" style="margin-top:8px">Colchão mínimo: ' + brl(p.colchao) + ' · alterar</button></div>';
}

function sheetColchao() {

/** Para cada cartão, a próxima fatura com saldo a pagar (e quantas vêm depois). */
function blocoFaturas() {
  if (!D.cartoes.length) return '';
  const linhas = [];
  D.cartoes.forEach(c => {
    const comps = Array.from(new Set(D.lanc.filter(t => t.cartao === c.id && t.tipo === 'despesa').map(t => t.comp))).sort();
    const abertas = comps.map(cp => ({ cp: cp, st: situacao(c, cp) })).filter(x => x.st.resta > 0.009);
    if (!abertas.length) return;
    const a = abertas[0], mais = abertas.slice(1);
    linhas.push('<div class="row clic" data-vercart="' + c.id + '|' + a.cp + '"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">▭</span>' +
      '<span class="t"><b>' + esc(c.nome) + '</b><small style="color:' + a.st.cor + '">vence ' + a.st.venc.split('-').reverse().join('/') +
      ' · ' + a.st.estado +
      (mais.length ? ' · +' + mais.length + ' fatura' + (mais.length === 1 ? '' : 's') + ' à frente (' + brl(mais.reduce((s, x) => s + x.st.resta, 0)) + ')' : '') +
      '</small></span><span class="v">' + brl(a.st.resta) + '</span><span class="del" aria-hidden="true">&rsaquo;</span></div>');
  });
  return '<div class="card"><h2>Faturas em aberto <em>próxima de cada cartão</em></h2>' +
    (linhas.length ? linhas.join('') : '<div class="empty"><b>Tudo pago</b>Nenhuma fatura com saldo a pagar.</div>') + '</div>';
}

/** Linha “com os previstos” sob a sobra do mês, quando há recorrentes a confirmar. */
function sobraPrevista(saldo, k) {
  const l = previstosDoMes(k);
  if (!l.length) return '';
  const v = saldo + l.reduce((s2, o) => s2 + (o.tipo === 'receita' ? o.valor : -o.valor), 0);
  return '<div class="tiny">com os ' + l.length + ' previsto' + (l.length === 1 ? '' : 's') + ': <b>' + brl(v) + '</b></div>';
}

function vResumo(k) {
  const t = somaMes(k), L = doMes(k);
  const noCartao = L.filter(x => x.meio === 'cartao' && x.tipo === 'despesa').reduce((s, x) => s + x.valor, 0);
  const aVista = t.des - noCartao;
  const porCat = {};
  L.filter(x => x.tipo === 'despesa').forEach(x => porCat[x.catId] = (porCat[x.catId] || 0) + x.valor);
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  if (selCat && !porCat[selCat]) selCat = null;

  const B = {
    sobra: () => '<section class="ribbon"><div class="figs"><div>' +

      '<div class="tiny">sobra do mês</div>' + sobraPrevista(t.saldo, k) + '</div>' +

      '<div class="stat"><b>' + brl(noCartao) + '</b><small>nas faturas de cartão</small></div></div>',

    confirmar: () => {
      const l = previstosView(k);
      if (!l.length) return '';
      return '<div class="card"><h2>A confirmar <em>' + l.length + ' previsto' + (l.length === 1 ? '' : 's') + '</em></h2>' + linhasPrevistos(l) +
        '<p class="tiny" style="margin:8px 0 0">Toque para conferir valor e data e confirmar. Enquanto não confirma, não entra no saldo nem na sobra.</p></div>';
    },

    faturas: () => blocoFaturas(),

    orcamento: () => blocoOrcamento(k),

    projecao: () => blocoProjecao(),

    grafico: () => linhaDoTempo(k),

    saldo: () => D.contas.length ? '<div class="card"><h2>Saldo em conta <em>posição de hoje</em></h2>' +
      D.contas.map(c => {
        const s = saldoConta(c.id);
        return '<div class="row"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">◈</span>' +
          '<span class="t"><b>' + esc(c.nome) + '</b>' + (c.reserva ? '<small>reserva · fora da projeção</small>' : '') + '</span>' +
          '<span class="v" style="color:' + (s < 0 ? 'var(--rust)' : 'inherit') + '">' + brl(s) + '</span></div>';
      }).join('') + '</div>' : '',

    categorias: () => '<div class="card"><h2>Por categoria <em>' + cats.length + ' ativa' + (cats.length === 1 ? '' : 's') + '</em></h2>' +
      (cats.length ? cats.map(([id, v]) => {
        const c = cat(id), o = D.orcs[id] || 0;
        return '<div class="budget-row clic' + (selCat === id ? ' marcada' : '') + '" data-seg="' + id + '"><div class="budget-head">' +
          '<span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">' + c.icone + '</span>' +
          '<span class="t">' + esc(c.nome) + '</span>' +
          '<span class="n ' + (o && v > o ? 'over' : '') + '">' + brl(v) + (o ? ' / ' + brl(o) : '') + '</span></div>' +
          (o ? '<div class="prog"><span style="width:' + Math.min(100, v/o*100) + '%;background:' + (v > o ? 'var(--rust)' : c.cor) + '"></span></div>' : '') +
          '</div>';
      }).join('') : '<div class="empty"><b>Competência em branco</b>Toque no + para lançar.</div>') + '</div>'
  };

  const p = painel();
  const vis = p.ordem.filter(id => !p.off.includes(id));
  return (vis.length ? vis.map(id => B[id]()).join('')
    : '<div class="card"><div class="empty"><b>Painel vazio</b>Todos os blocos estão desligados.</div></div>') +
    '<button class="link-suave" id="personalizar">Personalizar painel</button>' +
    '<div class="status">Salvo na sua planilha do Google.</div>';
}

/* ---------- lançamentos: busca e filtros ---------- */

let filtro = { q: '', cat: '', meio: '', tipo: '', todos: false, aberto: false };
const limparFiltro = () => { filtro = { q: '', cat: '', meio: '', tipo: '', todos: false, aberto: false }; };
const nFiltros = () => (filtro.cat ? 1 : 0) + (filtro.meio ? 1 : 0) + (filtro.tipo ? 1 : 0);
const filtroAtivo = () => !!filtro.q.trim() || nFiltros() > 0;
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const meioId = t => t.meio === 'cartao' && t.cartao ? 'cartao:' + t.cartao : t.meio;
const meioNome = id => id.indexOf('cartao:') === 0 ? (cartao(id.slice(7)) || { nome: 'Cartão' }).nome
  : ({ pix: 'Pix', debito: 'Débito', dinheiro: 'Dinheiro' })[id] || id;

function passa(t) {
  if (filtro.tipo && t.tipo !== filtro.tipo) return false;
  if (filtro.cat && t.catId !== filtro.cat) return false;
  if (filtro.meio && meioId(t) !== filtro.meio) return false;
  const q = filtro.q.trim();
  if (q) {
    if (norm(t.desc).indexOf(norm(q)) >= 0) return true;
    if (/\d/.test(q)) {                       // número: "45", "45,9", "1.234"
      const n = q.replace(/[.\s]/g, '');
      if (brlNum(t.valor).indexOf(n) >= 0) return true;
    }
    return false;
  }
  return true;
}

function filtroBarra() {
  const meios = ['pix', 'debito', 'dinheiro'].concat(D.cartoes.map(c => 'cartao:' + c.id));
  const chip = (attr, val, ativo, txt) => '<button class="chip" ' + attr + '="' + val + '" aria-pressed="' + ativo + '">' + txt + '</button>';
  return '<div class="card">' +
    '<div class="busca"><input id="lf-q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar nome ou valor" value="' + esc(filtro.q) + '">' +
    '<button class="chip" id="lf-abrir" aria-pressed="' + filtro.aberto + '">Filtros' + (nFiltros() ? ' · ' + nFiltros() : '') + '</button></div>' +
    '<div class="seg" style="margin-top:10px">' +
      '<button data-fscope="mes" aria-pressed="' + !filtro.todos + '">Este mês</button>' +
      '<button data-fscope="todos" aria-pressed="' + filtro.todos + '">Todos os meses</button></div>' +
    (filtro.aberto ?
      '<div class="flab">Tipo</div><div class="chips rolagem">' +
        chip('data-ftipo', 'despesa', filtro.tipo === 'despesa', 'Despesas') + chip('data-ftipo', 'receita', filtro.tipo === 'receita', 'Receitas') +
        chip('data-ftipo', 'transf', filtro.tipo === 'transf', 'Transferências') + chip('data-ftipo', 'ajuste', filtro.tipo === 'ajuste', 'Ajustes') + '</div>' +
      '<div class="two" style="margin-top:2px"><div><div class="flab">Meio de pagamento</div>' +
        '<select id="lf-meio" aria-label="Meio de pagamento"><option value="">Todos</option>' +
        meios.map(m => '<option value="' + m + '"' + (filtro.meio === m ? ' selected' : '') + '>' + esc(meioNome(m)) + '</option>').join('') + '</select></div>' +
      '<div><div class="flab">Categoria</div>' +
        '<select id="lf-cat" aria-label="Categoria"><option value="">Todas</option>' +
        '<optgroup label="Despesas">' + D.cats.filter(c => !c.receita).map(c => '<option value="' + c.id + '"' + (filtro.cat === c.id ? ' selected' : '') + '>' + c.icone + ' ' + esc(c.nome) + '</option>').join('') + '</optgroup>' +
        '<optgroup label="Receitas">' + D.cats.filter(c => c.receita).map(c => '<option value="' + c.id + '"' + (filtro.cat === c.id ? ' selected' : '') + '>' + c.icone + ' ' + esc(c.nome) + '</option>').join('') + '</optgroup>' +
        '</select></div></div>' +
        (filtroAtivo() ? '<button class="ghost" id="lf-limpar" style="margin-top:12px">Limpar filtros</button>' : '') : '') +
    '</div>';
}

/** Transferência e ajuste de saldo: linhas próprias, que não contam como receita nem despesa. */
function linhaEspecial(t) {
  const transf = t.tipo === 'transf';
  const o = conta(contaDe(t)), d = transf ? conta(t.destino) : null;
  const acoes = '<div class="sw-acoes' + (transf ? '' : ' dois') + '"><button data-sw="edit" data-id="' + t.id + '">Editar</button>' +
    (transf ? '<button data-sw="dup" data-id="' + t.id + '">Duplicar</button>' : '') +
    '<button data-sw="del" data-id="' + t.id + '">Excluir</button></div>';
  const meio = transf
    ? '<span class="dot" style="background:var(--surface-2);color:var(--ink-soft)">&#8644;</span>' +
      '<span class="t"><b>' + esc(t.desc || 'Transferência') + '</b><small>' + esc(o ? o.nome : '?') + ' &rarr; ' + esc(d ? d.nome : '?') + '</small></span>' +
      '<span class="v" style="color:var(--ink-soft)">' + brl(t.valor) + '</span>'
    : '<span class="dot" style="background:var(--surface-2);color:var(--ink-soft)">&plusmn;</span>' +
      '<span class="t"><b>Ajuste de saldo</b><small>' + esc(o ? o.nome : '?') + (t.desc && t.desc !== 'Ajuste de saldo' ? ' · ' + esc(t.desc) : '') + '</small></span>' +
      '<span class="v ' + (t.valor > 0 ? 'in' : '') + '">' + (t.valor > 0 ? '+' : '') + brl(t.valor) + '</span>';
  return '<div class="sw">' + acoes + '<div class="row clic" data-edit="' + t.id + '">' + meio + '<span class="del" aria-hidden="true">&rsaquo;</span></div></div>';
}

/** Abre o formulário certo para cada tipo de lançamento. */
function editar(id) {
  const t = D.lanc.find(x => x.id === id); if (!t) return;
  if (t.tipo === 'transf') sheetTransf(id);
  else if (t.tipo === 'ajuste') sheetAjuste(null, id);
  else sheetLanc(id);
}

function diasHtml(L) {
  const dias = {};
  L.forEach(t => (dias[t.data] = dias[t.data] || []).push(t));
  return Object.keys(dias).sort().reverse().map(d => {
    const arr = dias[d], p = d.split('-');
    return '<div class="card"><h2>' + p[2] + '/' + p[1] + (filtro.todos ? '/' + p[0] : '') + '<em>' +
      brl(arr.reduce((s, t) => s + efeito(t), 0)) + '</em></h2>' +
      arr.map(t => {
        if (t.tipo === 'transf' || t.tipo === 'ajuste') return linhaEspecial(t);
        const c = cat(t.catId);
        const cc = t.meio === 'cartao' ? cartao(t.cartao) : null;
        const via = cc ? cc.nome : (t.meio === 'pix' ? 'Pix' : t.meio === 'debito' ? 'Débito' : 'Dinheiro');
        return '<div class="sw"><div class="sw-acoes">' +
          '<button data-sw="edit" data-id="' + t.id + '">Editar</button>' +
          '<button data-sw="dup" data-id="' + t.id + '">Duplicar</button>' +
          '<button data-sw="del" data-id="' + t.id + '">Excluir</button></div>' +
          '<div class="row clic" data-edit="' + t.id + '"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">' + c.icone + '</span>' +
          '<span class="t"><b>' + esc(t.desc) + '</b><small>' + c.nome + ' · ' + esc(via) +
          (t.parc ? ' · ' + t.parc.i + '/' + t.parc.n : '') + (t.fixo ? ' · fixo' : '') + '</small></span>' +
          '<span class="v ' + (t.tipo === 'receita' ? 'in' : '') + '">' + (t.tipo === 'receita' ? '+' : '') + brl(t.valor) + '</span>' +
          '<span class="del" aria-hidden="true">&rsaquo;</span></div></div>';
      }).join('') + '</div>';
  }).join('');
}

function corpoLanc(k) {
  const ativo = filtroAtivo();
  const L = (filtro.todos ? D.lanc : doMes(k)).filter(passa).sort((a, b) => b.data.localeCompare(a.data));

  let html = '';
  if (ativo) {
    const rm = (k2, txt) => '<button class="chip" data-rmf="' + k2 + '">' + txt + ' ✕</button>';
    html += '<div class="ativos">' +
      (filtro.q.trim() ? rm('q', '“' + esc(filtro.q.trim()) + '”') : '') +
      (filtro.tipo ? rm('tipo', ({ receita: 'Receitas', despesa: 'Despesas', transf: 'Transferências', ajuste: 'Ajustes' })[filtro.tipo]) : '') +
      (filtro.meio ? rm('meio', esc(meioNome(filtro.meio))) : '') +
      (filtro.cat ? rm('cat', esc(cat(filtro.cat).nome)) : '') +
      '<button class="chip" data-rmf="all" style="background:transparent">Limpar filtros</button></div>';
  }
  const P = filtro.todos ? [] : previstosView(k).filter(passa);
  const cardPrev = P.length
    ? '<div class="card"><h2>Previstos <em>' + P.length + ' a confirmar · fora do saldo</em></h2>' + linhasPrevistos(P) + '</div>' : '';
  if (!L.length && P.length) return html + cardPrev;
  if (!L.length) {
    return html + '<div class="card"><div class="empty">' + (ativo
      ? '<b>Nada encontrado</b>Tente outro termo ou limpe os filtros.'
      : filtro.todos ? '<b>Nenhum lançamento ainda</b>Toque no + para começar.'
      : '<b>Nada em ' + MES[cursor.getMonth()] + '</b>Toque no + para começar.') + '</div></div>';
  }
  if (ativo || filtro.todos) {
    const rec = L.filter(t => t.tipo === 'receita').reduce((s, t) => s + t.valor, 0);
    const des = L.filter(t => t.tipo === 'despesa').reduce((s, t) => s + t.valor, 0);
    html += '<div class="res-filtro">' + L.length + ' lançamento' + (L.length === 1 ? '' : 's') +
      ' · entrou ' + brl(rec) + ' · saiu ' + brl(des) + (filtro.todos ? ' · todos os meses' : '') + '</div>';
  }
  if (!filtro.todos) return html + cardPrev + diasHtml(L);

  const meses = {};
  L.forEach(t => (meses[t.comp] = meses[t.comp] || []).push(t));
  return html + Object.keys(meses).sort().reverse().map(cp => {
    const arr = meses[cp], p = cp.split('-');
    const des = arr.filter(t => t.tipo === 'despesa').reduce((s, t) => s + t.valor, 0);
    return '<div class="mes-h">' + MES[Number(p[1]) - 1] + ' ' + p[0] + '<em>saiu ' + brl(des) + '</em></div>' + diasHtml(arr);
  }).join('');
}

function vLanc(k) {
  return filtroBarra() + '<div id="lanc-corpo">' + corpoLanc(k) + '</div>';
}

function ligaCorpo() {
  document.querySelectorAll('#lanc-corpo [data-edit]').forEach(b => b.onclick = () => editar(b.dataset.edit));
  document.querySelectorAll('#lanc-corpo [data-conf]').forEach(b => b.onclick = () => confirmarPrevisto(b.dataset.conf));
  document.querySelectorAll('[data-rmf]').forEach(b => b.onclick = () => {
    const w = b.dataset.rmf;
    if (w === 'all') { filtro.q = ''; filtro.cat = ''; filtro.meio = ''; filtro.tipo = ''; }
    else filtro[w] = '';
    render();
  });
}

/* ---------- faturas do cartão ---------- */

let cartaoAberto = null, faturaAberta = null, mostrarPagas = false, catFatura = null;

function abrirCartao(id, comp) {
  cartaoAberto = id; faturaAberta = comp || null; mostrarPagas = false; catFatura = null;
  render(); window.scrollTo(0, 0);
  anima([{ transform: 'translateX(28px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 220);
}
function abrirFatura(comp) {
  faturaAberta = comp; catFatura = null;
  render(); window.scrollTo(0, 0);
  anima([{ transform: 'translateX(28px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 220);
}
/** Sobe um nível dentro da Carteira (fatura → cartão → lista de cartões). */
function voltarNivel() {
  catFatura = null;
  if (faturaAberta) faturaAberta = null; else cartaoAberto = null;
  render(); window.scrollTo(0, 0);
  anima([{ transform: 'translateX(-28px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 220);
}

/* ---------- botão voltar do celular ----------
   Ordem: fecha a folha aberta → sobe um nível na Carteira → volta ao Resumo → só então sai do app.
   Há no máximo UMA entrada extra no histórico, criada só quando existe algo para voltar. */
let guardaHist = false, descartando = false, sheetAberta = false;
const ehRaiz = () => !sheetAberta && !cartaoAberto && tab === 'resumo';
function sincronizaHistorico() {
  if (!ehRaiz() && !guardaHist) {
    try { history.pushState({ g: 1 }, ''); guardaHist = true; } catch (e) {}
  } else if (ehRaiz() && guardaHist) {
    descartando = true; guardaHist = false;
    setTimeout(() => { descartando = false; }, 400);
    try { history.back(); } catch (e) { descartando = false; }
  }
}
window.addEventListener('popstate', () => {
  if (descartando) { descartando = false; return; }
  guardaHist = false;
  if (sheetAberta) closeSheet();
  else if (faturaAberta || cartaoAberto) voltarNivel();
  else if (tab !== 'resumo') trocaAba('resumo');
  sincronizaHistorico();
});

const rotuloComp = cp => { const m = MES[Number(cp.slice(5)) - 1]; return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + cp.slice(0, 4); };
const dataBR = iso => iso.split('-').reverse().join('/');

function vCartaoFaturas(c) {
  const comps = Array.from(new Set(
    D.lanc.filter(t => t.cartao === c.id && t.tipo === 'despesa').map(t => t.comp)
      .concat(D.pagamentos.filter(p => p.cartao === c.id).map(p => p.comp)))).sort();
  const itens = comps.map(cp => ({ cp: cp, st: situacao(c, cp) })).filter(x => x.st.total > 0 || x.st.pago > 0);
  const quitada = x => x.st.total > 0 && x.st.resta <= 0.009;
  const pagas = itens.filter(quitada).reverse();
  const abertas = itens.filter(x => !quitada(x));
  const u = usado(c.id), disp = c.limite - u;
  const linha = x => {
    const st = x.st, ok = quitada(x);
    return '<div class="row clic" data-fat="' + x.cp + '"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">▭</span>' +
      '<span class="t"><b>' + rotuloComp(x.cp) + '</b>' +
      '<small style="color:' + st.cor + '">vence ' + dataBR(st.venc) + ' · ' + st.estado +
      (st.pago > 0 && !ok ? ' · pago ' + brl(st.pago) : '') + '</small></span>' +
      '<span class="v" style="color:' + (ok ? 'var(--green)' : 'inherit') + '">' + brl(ok ? st.total : st.resta) + '</span>' +
      '<span class="del" aria-hidden="true">&rsaquo;</span></div>';
  };
  return '<button class="voltar" data-voltar>‹ Cartões</button>' +
    '<div class="cartao" style="border-left-color:' + c.cor + '">' +
    '<div class="ch"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">▭</span><b>' + esc(c.nome) + '</b></div>' +
    '<div class="venc">fecha dia ' + c.fechamento + ' · vence dia ' + c.vencimento + '</div>' +
    (c.limite > 0 ?
      '<div class="budget-head" style="margin-top:10px"><span class="t tiny">limite ' + brl(c.limite) + ' · usado ' + brl(u) + '</span>' +
      '<span class="n' + (disp < 0 ? ' over' : '') + '">' + brl(disp) + ' livre</span></div>' +
      '<div class="prog"><span style="width:' + Math.min(100, u / c.limite * 100) + '%;background:' + (disp < 0 ? 'var(--rust)' : c.cor) + '"></span></div>' : '') +
    '</div>' +
    '<div class="card"><h2>Faturas <em>toque para ver os lançamentos</em></h2>' +
    (abertas.length ? abertas.map(linha).join('') : '<div class="empty"><b>' + (pagas.length ? 'Tudo pago' : 'Sem faturas ainda') + '</b>' +
      (pagas.length ? 'Nenhuma fatura em aberto.' : 'Lance uma compra neste cartão para criar a primeira.') + '</div>') +
    '</div>' +
    (pagas.length ? '<button class="ghost" id="mais-pagas" style="margin-bottom:12px">' +
      (mostrarPagas ? 'Esconder faturas pagas' : 'Ver faturas pagas (' + pagas.length + ')') + '</button>' : '') +
    (mostrarPagas && pagas.length ? '<div class="card"><h2>Pagas <em>mais recentes primeiro</em></h2>' + pagas.map(linha).join('') + '</div>' : '');
}

function vFatura(c, cp) {
  const st = situacao(c, cp), hoje = hojeISO();
  const dias = Math.round((new Date(st.venc + 'T12:00:00') - new Date(hoje + 'T12:00:00')) / 86400000);
  const L = D.lanc.filter(t => t.cartao === c.id && t.comp === cp && t.tipo === 'despesa').sort((a, b) => b.data.localeCompare(a.data));
  const pagos = D.pagamentos.filter(p => p.cartao === c.id && p.comp === cp).sort((a, b) => a.data.localeCompare(b.data));
  const porCat = {};
  L.forEach(t => porCat[t.catId] = (porCat[t.catId] || 0) + t.valor);
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const tot = st.total || 1;
  if (catFatura && !porCat[catFatura]) catFatura = null;
  const Lv = catFatura ? L.filter(t => t.catId === catFatura) : L;

  return '<button class="voltar" data-voltar>‹ Faturas de ' + esc(c.nome) + '</button>' +
    '<div class="cartao fat-topo" style="border-left-color:' + c.cor + '">' +
    '<div class="ch"><b>Fatura de ' + rotuloComp(cp) + '</b></div>' +
    '<div class="fatura">' + brl(st.resta > 0 ? st.resta : st.total) + '</div>' +
    '<div class="venc" style="color:' + st.cor + ';font-weight:' + (st.cor === 'var(--ink-soft)' ? '400' : '600') + '">' + st.estado +
      (st.resta > 0.009 ? ' · falta pagar' : '') + '</div>' +
    '<div class="venc">total ' + brl(st.total) + (st.pago > 0 ? ' · pago ' + brl(st.pago) : '') + '</div>' +
    '<div class="venc">vence ' + dataBR(st.venc) +
      (dias === 0 ? ' · hoje' : dias > 0 ? ' · em ' + dias + ' dia' + (dias === 1 ? '' : 's') : ' · há ' + (-dias) + ' dia' + (dias === -1 ? '' : 's')) + '</div>' +
    (st.total > 0 && st.pagavel ? '<button class="chip" data-pagarfat="' + c.id + '" style="margin-top:8px">' +
      (st.resta > 0.009 ? 'Registrar pagamento' : 'Pagar mais') + '</button>' : '') +
    (st.total > 0 && !st.pagavel ? '<div class="venc" style="margin-top:8px">Fatura ainda não aberta · só pode ser paga a partir de ' + dataBR(st.abre) + '</div>' : '') +
    (pagos.length ? '<div style="margin-top:8px">' + pagos.map(p =>
      '<div class="row"><span class="dot" style="background:var(--green)22;color:var(--green)">✓</span>' +
      '<span class="t"><b>' + dataBR(p.data) + '</b><small>' +
      (p.obs ? esc(p.obs) + ' · ' : '') + (conta(p.conta) ? esc(conta(p.conta).nome) : 'conta principal') + '</small></span>' +
      '<span class="v">' + brl(p.valor) + '</span>' +
      '<button class="del" data-delpag="' + p.id + '">&#10005;</button></div>').join('') + '</div>' : '') +
    '</div>' +

    (cats.length ? '<div class="card"><h2>Por categoria <em>toque para ver os lançamentos</em></h2>' +
      cats.map(([id, v]) => {
        const ct = cat(id), pct = v / tot * 100;
        return '<div class="budget-row clic' + (catFatura === id ? ' marcada' : '') + '" data-fcatfat="' + id + '"><div class="budget-head">' +
          '<span class="dot" style="background:' + ct.cor + '22;color:' + ct.cor + '">' + ct.icone + '</span>' +
          '<span class="t">' + esc(ct.nome) + '</span>' +
          '<span class="n">' + brl(v) + ' · ' + (pct < 1 ? '<1' : pct.toFixed(0)) + '%</span></div>' +
          '<div class="prog"><span style="width:' + pct.toFixed(1) + '%;background:' + ct.cor + '"></span></div></div>';
      }).join('') + '</div>' : '') +

    '<div class="mes-h" id="fat-lista" style="text-transform:none;scroll-margin-top:72px">Lançamentos<em>' + Lv.length + ' item' + (Lv.length === 1 ? '' : 's') + '</em></div>' +
    (catFatura ? '<div class="ativos"><button class="chip" data-limpacat>' + cat(catFatura).icone + ' Só ' + esc(cat(catFatura).nome) + ' · ' + brl(porCat[catFatura]) + ' ✕</button></div>' : '') +
    (L.length ? diasHtml(Lv) : '<div class="card"><div class="empty"><b>Sem lançamentos</b>Esta fatura não tem compras no cartão.</div></div>');
}

function vCarteira(k) {
  if (cartaoAberto) {
    const cc = cartao(cartaoAberto);
    if (cc) return faturaAberta ? vFatura(cc, faturaAberta) : vCartaoFaturas(cc);
    cartaoAberto = null; faturaAberta = null;
  }
  const hoje = hojeISO();
  let html = '';

  html += D.cartoes.length ? D.cartoes.map(c => {

    return '<div class="cartao" style="border-left-color:' + c.cor + '">' +

      (st.total > 0 && st.pagavel ? '<button class="chip" data-pagar="' + c.id + '" style="margin-bottom:4px">' +

      '<button class="chip" data-vercartao="' + c.id + '" style="margin:0 0 4px 6px">Ver faturas</button>' +

      (pagos.length ? '<div style="margin-top:8px">' + pagos.map(p =>
        '<div class="row"><span class="dot" style="background:var(--green)22;color:var(--green)">✓</span>' +
        '<span class="t"><b>' + p.data.split('-').reverse().join('/') + '</b><small>' +
        (p.obs ? esc(p.obs) + ' · ' : '') + (conta(p.conta) ? esc(conta(p.conta).nome) : 'conta principal') + '</small></span>' +
        '<span class="v">' + brl(p.valor) + '</span>' +
        '<button class="del" data-delpag="' + p.id + '">&#10005;</button></div>').join('') + '</div>' : '') +

      (c.limite > 0 ?
        '<div class="budget-head" style="margin-top:12px"><span class="t tiny">limite ' + brl(c.limite) + '</span>' +
        '<span class="n' + (disp < 0 ? ' over' : '') + '">' + brl(disp) + ' livre</span></div>' +
        '<div class="prog"><span style="width:' + Math.min(100, u / c.limite * 100) + '%;background:' +
        (disp < 0 ? 'var(--rust)' : c.cor) + '"></span></div>' : '') +

      (proximas.length ? '<div style="margin-top:12px">' + proximas.map(p =>
        '<div class="fut"><span class="m">' + MES[p.d.getMonth()].slice(0,3) + '/' + String(p.d.getFullYear()).slice(2) + '</span>' +
        '<span class="pb"><span style="width:' + (p.v/maxP*100).toFixed(1) + '%;background:' + (p.quitada ? 'var(--green)' : c.cor) + '"></span></span>' +
        '<span class="pv">' + brl(p.v) + '</span></div>').join('') +
        '<p class="tiny" style="margin:8px 0 0">Faturas futuras já comprometidas. Verde = já quitada.</p></div>' : '') +
      '</div>';
  }).join('') : '<div class="card"><div class="empty"><b>Nenhum cartão</b>Cadastre o dia de fechamento e de vencimento — o app calcula em que fatura cada compra cai.</div></div>';

  html += '<button class="ghost" id="novocartao" style="margin-bottom:16px">Adicionar cartão</button>';

  html += '<div class="card"><h2>Contas <em>saldo de hoje</em></h2>' +
    D.contas.map(c => {
      const s = saldoConta(c.id);
      return '<div class="row"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">◈</span>' +
        '<span class="t"><b>' + esc(c.nome) + '</b><small>inicial ' + brl(c.inicial) + (c.reserva ? ' · reserva' : '') + '</small></span>' +
        '<span class="v" style="color:' + (s < 0 ? 'var(--rust)' : 'inherit') + '">' + brl(s) + '</span>' +
        '<button class="chip" data-edconta="' + c.id + '">editar</button></div>' +
        '<div class="mini-chips"><button class="chip" data-ajustar="' + c.id + '">Ajustar saldo</button>' +
        (D.contas.length > 1 ? '<button class="chip" data-transfde="' + c.id + '">Transferir</button>' : '') + '</div>';
    }).join('') +
    '<button class="ghost" id="novaconta">Adicionar conta</button>' +
    (D.contas.length > 1 ? '<button class="ghost" id="novatransf" style="margin-top:8px">Transferir entre contas</button>' : '') +
    '<p class="tiny" style="margin:10px 0 0">“Ajustar saldo” corrige a diferença entre o app e o seu banco sem contar como receita ou despesa. ' +

      return '<div class="row clic" data-edrec="' + r.id + '"><span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">' + c.icone + '</span>' +

        '<span class="v ' + (r.tipo === 'receita' ? 'in' : '') + '">' + brl(r.valor) + '</span><span class="del" aria-hidden="true">&rsaquo;</span></div>';
    }).join('') : '<div class="empty"><b>Nenhum recorrente</b>Salário, aluguel, assinaturas… cadastre uma vez e confirme todo mês, ajustando valor e data.</div>') +
