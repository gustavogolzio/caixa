    '<button class="ghost" id="btconexao" style="margin-top:0">Rever URL e token</button></div>';

  return html;
}

function vOrc(k) {
  const pv = {};
  previstosDoMes(k).forEach(o => { if (o.tipo === 'despesa') pv[o.catId] = (pv[o.catId] || 0) + o.valor; });
  const g = {};
  doMes(k).filter(t => t.tipo === 'despesa').forEach(t => g[t.catId] = (g[t.catId] || 0) + t.valor);
  const desp = D.cats.filter(c => !c.receita);
  const totOrc = desp.reduce((s, c) => s + (D.orcs[c.id] || 0), 0);
  const totG = desp.reduce((s, c) => s + (g[c.id] || 0), 0);
  return '<div class="card"><h2>Limite do mês <em>' + (totOrc ? brl(totG) + ' de ' + brl(totOrc) : 'sem limite definido') + '</em></h2>' +
    '<div class="prog" style="height:11px"><span style="width:' + (totOrc ? Math.min(100, totG/totOrc*100) : 0) +
    '%;background:' + (totOrc && totG > totOrc ? 'var(--rust)' : 'var(--green)') + '"></span></div>' +
    '<p class="tiny" style="margin:9px 0 0">' + (totOrc ? (totG > totOrc ? 'Estourou ' + brl(totG - totOrc) + '.' :
      'Sobram ' + brl(totOrc - totG) + ' nesta competência.') : 'Defina um teto por categoria abaixo — vale para todos os meses.') + '</p></div>' +
    '<div class="card"><h2>Despesas <em>toque no nome para editar</em></h2>' + desp.map(c => {
      const gg = g[c.id] || 0, o = D.orcs[c.id] || 0;
      return '<div class="budget-row"><div class="budget-head">' +
        '<span class="dot clic" data-edcat="' + c.id + '" style="background:' + c.cor + '22;color:' + c.cor + '">' + c.icone + '</span>' +
        '<span class="t clic" data-edcat="' + c.id + '">' + esc(c.nome) + '<br><span class="n">gasto ' + brl(gg) + (pv[c.id] ? ' · previsto +' + brl(pv[c.id]) : '') + '</span></span>' +
        '<input class="mini-in" type="number" inputmode="decimal" step="10" min="0" placeholder="sem teto" value="' +
        (o || '') + '" data-orc="' + c.id + '"></div>' +
        (o ? '<div class="prog dupla"><span class="pv" style="width:' + Math.min(100, ((gg + (pv[c.id] || 0)) / o) * 100) + '%;background:' + (gg > o ? 'var(--rust)' : c.cor) + '"></span>' +
          '<span style="width:' + Math.min(100, gg/o*100) + '%;background:' + (gg > o ? 'var(--rust)' : c.cor) + '"></span></div>' : '') +
        '</div>';
    }).join('') +
    '<button class="ghost" id="novacat-despesa">Adicionar categoria de despesa</button></div>' +

    '<div class="card"><h2>Receitas</h2>' + D.cats.filter(c => c.receita).map(c =>
      '<div class="row clic" data-edcat="' + c.id + '">' +
      '<span class="dot" style="background:' + c.cor + '22;color:' + c.cor + '">' + c.icone + '</span>' +
      '<span class="t"><b>' + esc(c.nome) + '</b></span>' +
      '<span class="del" aria-hidden="true">&rsaquo;</span></div>').join('') +
    '<button class="ghost" id="novacat-receita">Adicionar categoria de receita</button></div>';
}

function vMetas() {
  return '<div class="card"><h2>Metas <em>' + D.metas.length + ' ativa' + (D.metas.length === 1 ? '' : 's') + '</em></h2>' +
    (D.metas.length ? D.metas.map(m => {
      const falta = Math.max(0, m.alvo - m.guardado);
      let prazo = '';
      if (m.prazo) {
        const d = new Date(m.prazo + '-01T12:00:00'), h = new Date();
        const n = (d.getFullYear() - h.getFullYear()) * 12 + (d.getMonth() - h.getMonth());
        prazo = n > 0 ? ' · ' + brl(falta / n) + '/mês por ' + n + (n === 1 ? ' mês' : ' meses') : ' · prazo vencido';
      }
      return '<div class="budget-row"><div class="budget-head">' +
        '<span class="dot" style="background:var(--ochre-soft);color:var(--ochre)">&#127919;</span>' +
        '<span class="t">' + esc(m.nome) + '<br><span class="n">' + brl(m.guardado) + ' de ' + brl(m.alvo) + prazo + '</span></span>' +
        '<button class="chip" data-guardar="' + m.id + '">+ guardar</button>' +
        '<button class="del" data-delmeta="' + m.id + '">&#10005;</button></div>' +
        '<div class="prog"><span style="width:' + Math.min(100, m.guardado/m.alvo*100) + '%;background:var(--ochre)"></span></div></div>';
    }).join('') : '<div class="empty"><b>Sem metas</b>Reserva, viagem, troca de carro — defina o alvo e acompanhe.</div>') +
    '<button class="ghost" id="novameta">Criar meta</button></div>';
}

function wire(k) {

  document.querySelectorAll('[data-transfde]').forEach(b => b.onclick = () => sheetTransf(null, { origem: b.dataset.transfde }));
  document.querySelectorAll('[data-ajustar]').forEach(b => b.onclick = () => sheetAjuste(b.dataset.ajustar));
  const pz = document.getElementById('personalizar'); if (pz) pz.onclick = sheetPainel;

  document.querySelectorAll('[data-fat]').forEach(b => b.onclick = () => abrirFatura(b.dataset.fat));
  document.querySelectorAll('[data-voltar]').forEach(b => b.onclick = voltarNivel);
  document.querySelectorAll('[data-pagarfat]').forEach(b => b.onclick = () => sheetPagamento(b.dataset.pagarfat, faturaAberta));
  document.querySelectorAll('[data-fcatfat]').forEach(b => b.onclick = () => {
    catFatura = catFatura === b.dataset.fcatfat ? null : b.dataset.fcatfat;
    render();
    if (catFatura) { const el = document.getElementById('fat-lista'); if (el) el.scrollIntoView({ behavior: reduzMovimento() ? 'auto' : 'smooth', block: 'start' }); }
  });
  document.querySelectorAll('[data-limpacat]').forEach(b => b.onclick = () => { catFatura = null; render(); });
  const mp = document.getElementById('mais-pagas'); if (mp) mp.onclick = () => { mostrarPagas = !mostrarPagas; render(); };
  const fq = document.getElementById('lf-q');
  if (fq) {
    fq.oninput = () => {
      filtro.q = fq.value;
      document.getElementById('lanc-corpo').innerHTML = corpoLanc(k);
      ligaCorpo();
    };
    ligaCorpo();
  }
  const fa = document.getElementById('lf-abrir');
  if (fa) fa.onclick = () => { filtro.aberto = !filtro.aberto; render(); };
  const fl = document.getElementById('lf-limpar');
  if (fl) fl.onclick = () => { filtro.q = ''; filtro.cat = ''; filtro.meio = ''; filtro.tipo = ''; render(); };
  document.querySelectorAll('[data-fscope]').forEach(b => b.onclick = () => { filtro.todos = b.dataset.fscope === 'todos'; render(); });
  document.querySelectorAll('[data-ftipo]').forEach(b => b.onclick = () => {
    filtro.tipo = filtro.tipo === b.dataset.ftipo ? '' : b.dataset.ftipo; render();
  });
  const lm = document.getElementById('lf-meio'); if (lm) lm.onchange = () => { filtro.meio = lm.value; render(); };
  const lc = document.getElementById('lf-cat'); if (lc) lc.onchange = () => { filtro.cat = lc.value; render(); };
  document.querySelectorAll('[data-orc]').forEach(inp => inp.onchange = async () => {
    const v = parseFloat(String(inp.value).replace(',', '.')) || 0;
    if (v > 0) D.orcs[inp.dataset.orc] = v; else delete D.orcs[inp.dataset.orc];
    render();
    try { await api('setOrc', inp.dataset.orc, v); } catch (e) { toast('Erro ao salvar teto'); }
  });
  document.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => {
    selMes = (selMes === b.dataset.mes) ? null : b.dataset.mes;
    render();
  });
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    const p = b.dataset.ir.split('-');
    cursor = new Date(Number(p[0]), Number(p[1]) - 1, 1);
    selMes = null; selCat = null; render();
  });
  document.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => {
    selCat = (selCat === b.dataset.seg) ? null : b.dataset.seg;
    render();
  });
  const nm = document.getElementById('novameta'); if (nm) nm.onclick = sheetMeta;
  document.querySelectorAll('[data-edcat]').forEach(b => b.onclick = () => sheetCategoria(b.dataset.edcat));
  const ncd = document.getElementById('novacat-despesa'); if (ncd) ncd.onclick = () => sheetCategoria(null, 'despesa');
  const ncr = document.getElementById('novacat-receita'); if (ncr) ncr.onclick = () => sheetCategoria(null, 'receita');
  const nc = document.getElementById('novocartao'); if (nc) nc.onclick = () => sheetCartao(null);
  const nk = document.getElementById('novaconta'); if (nk) nk.onclick = () => sheetConta(null);
  const bc = document.getElementById('btconexao'); if (bc) bc.onclick = () => telaConexao();
  document.querySelectorAll('[data-edcartao]').forEach(b => b.onclick = () => sheetCartao(b.dataset.edcartao));
  document.querySelectorAll('[data-pagar]').forEach(b => b.onclick = () => sheetPagamento(b.dataset.pagar, k));
  document.querySelectorAll('[data-delpag]').forEach(b => b.onclick = async () => {
    if (!confirm('Excluir este pagamento?')) return;
    D.pagamentos = D.pagamentos.filter(x => x.id !== b.dataset.delpag); render();
    try { await api('delPagamento', b.dataset.delpag); } catch (e) { toast('Erro ao excluir'); carregar(); }
  });
  document.querySelectorAll('[data-edconta]').forEach(b => b.onclick = () => sheetConta(b.dataset.edconta));
  document.querySelectorAll('[data-guardar]').forEach(b => b.onclick = async () => {
    const m = D.metas.find(x => x.id === b.dataset.guardar);
    const n = parseFloat(String(prompt('Quanto guardar em "' + m.nome + '"?', '') || '').replace('.', '').replace(',', '.'));
    if (!(n > 0)) return;
    m.guardado += n; render();
    try { await api('updMeta', m.id, m.guardado); } catch (e) { toast('Erro ao salvar'); }
  });
  document.querySelectorAll('[data-delmeta]').forEach(b => b.onclick = async () => {
    if (!confirm('Excluir esta meta?')) return;
    D.metas = D.metas.filter(x => x.id !== b.dataset.delmeta); render();
    try { await api('delMeta', b.dataset.delmeta); } catch (e) { toast('Erro ao excluir'); }
  });
}

const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');
let tSheet = null;
function openSheet(html) {
  clearTimeout(tSheet); sheet.classList.remove('saindo');
  sheet.innerHTML = '<div class="grab"></div>' + html; sheet.classList.add('on'); scrim.classList.add('on');
  sheetAberta = true; sincronizaHistorico();
}
function closeSheet() {
  if (!sheet.classList.contains('on')) return;
  sheetAberta = false; sincronizaHistorico();
  scrim.classList.remove('on');
  if (reduzMovimento()) { sheet.classList.remove('on'); return; }
  sheet.classList.add('saindo');
  clearTimeout(tSheet);
  tSheet = setTimeout(() => sheet.classList.remove('on', 'saindo'), 180);
}
scrim.onclick = closeSheet;

/* ---------- formulário de lançamento ---------- */

function sheetLanc(editId, modelo) {
  const t = editId ? D.lanc.find(x => x.id === editId) : null;
  const m0 = t || modelo || null;   // modelo = duplicar: preenche o formulário como lançamento novo
  const irmaos = t && t.grupo ? D.lanc.filter(x => x.grupo === t.grupo) : [];
  const temGrupo = irmaos.length > 1;

  const h = new Date();
  const dPadrao = (cursor.getMonth() === h.getMonth() && cursor.getFullYear() === h.getFullYear())
    ? h : new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  let isoPadrao = dPadrao.getFullYear() + '-' + String(dPadrao.getMonth()+1).padStart(2,'0') + '-' + String(dPadrao.getDate()).padStart(2,'0');
  if (modelo && !modelo.dataFixa) {   // mesmo dia do original, no mês que está na tela (ajustado se o mês for mais curto)
    const ult = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
    const dia = Math.min(Number(modelo.data.slice(8, 10)) || 1, ult);
    isoPadrao = mk(cursor) + '-' + String(dia).padStart(2, '0');
  }
  if (modelo && modelo.dataFixa) isoPadrao = modelo.dataFixa;   // previsto: a data esperada, que você pode mudar
  const confirmando = !!(modelo && modelo.rec);

  // no grupo, a data de referência é a do primeiro item
  const dataGrupo = temGrupo ? irmaos.map(x => x.data).sort()[0] : null;

  const meios = [{id:'pix', nome:'Pix', icone:'⚡'}, {id:'debito', nome:'Débito', icone:'💳'}, {id:'dinheiro', nome:'Dinheiro', icone:'💵'}]
    .concat(D.cartoes.map(c => ({ id: 'cartao:' + c.id, nome: c.nome, icone: '▭' })));

  let tipo = m0 ? m0.tipo : 'despesa';
  let catId = m0 ? m0.catId : (D.cats.find(c => !c.receita) || {}).id;
  let meio = m0 ? (m0.meio === 'cartao' && m0.cartao ? 'cartao:' + m0.cartao : m0.meio) : 'pix';
  let escopo = 'uma';
  let forma = (t && t.parc) ? 'parcelado' : 'avista';
  let base = 'total';

  const nOrig = t && t.parc ? t.parc.n : 1;
  // parcela mais baixa que existe no grupo: um grupo lançado em andamento começa em 5, não em 1
  const iniOrig = (t && t.parc && temGrupo) ? Math.min.apply(null, irmaos.map(x => x.parc ? x.parc.i : 1)) : 1;
  let inicio = iniOrig;
  const compGrupo = temGrupo ? irmaos.map(x => x.comp).sort()[0] : null;
  const repOrig = (t && t.fixo && temGrupo) ? irmaos.length : 1;
  const repOpts = [1, 3, 6, 12, 24].indexOf(repOrig) === -1 ? [repOrig, 3, 6, 12, 24] : [1, 3, 6, 12, 24];

  openSheet('<h2>' + (t ? 'Editar lançamento' : confirmando ? 'Confirmar previsto' : modelo ? 'Duplicar lançamento' : 'Novo lançamento') + '</h2>' +

    (temGrupo ? '<label>O que você quer alterar</label>' +
      '<div class="seg" id="escopo"><button data-escopo="uma" aria-pressed="true">Só esta ' +
        (t.parc ? 'parcela' : 'ocorrência') + '</button>' +
      '<button data-escopo="todas" aria-pressed="false">Todas as ' + irmaos.length +
        (t.parc && irmaos.length < nOrig ? ' lançadas' : '') + '</button></div>' : '') +

    '<div class="seg" id="tipo" style="margin-top:11px"><button data-tipo="despesa" aria-pressed="' + (tipo === 'despesa') + '">Despesa</button>' +
    '<button data-tipo="receita" aria-pressed="' + (tipo === 'receita') + '">Receita</button>' +
    (!t && !modelo ? '<button data-tipo="transf" aria-pressed="false">Transferência</button>' : '') + '</div>' +

    (confirmando ? '<div class="aviso" style="margin-top:10px">Previsto de ' + esc(modelo.mm.slice(5) + '/' + modelo.mm.slice(0, 4)) + '. Ajuste valor e data para o que realmente aconteceu e salve.</div>' : '') +

    '<label for="f-desc">Descrição</label><input id="f-desc" autocomplete="off" value="' + (m0 ? esc(m0.desc) : '') + '" placeholder="Mercado, Uber, salário…">' +
    '<div class="chips sug hide" id="f-sug"></div>' +

    '<div id="bloco-base" class="hide"><label>O valor que você tem em mãos</label>' +
    '<div class="seg" id="base"><button data-base="total" aria-pressed="true">Valor total</button>' +
    '<button data-base="parcela" aria-pressed="false">Valor da parcela</button></div></div>' +

    '<div class="two"><div><label for="f-val" id="lab-val">Valor (R$)</label>' +
    '<input id="f-val" type="text" inputmode="decimal" placeholder="0,00" value="' + (m0 ? brlNum(m0.valor) : '') + '"></div>' +
    '<div><label for="f-data" id="lab-data">Data</label>' +
    '<input id="f-data" type="date" value="' + (t ? t.data : isoPadrao) + '">' +
    '<input id="f-mes" class="hide" type="month" value="' + (compGrupo || mk(cursor)) + '"></div></div>' +

    '<label for="f-meio">Como foi pago</label><select id="f-meio"></select>' +

    '<div id="bloco-conta"><label for="f-conta">Conta</label><select id="f-conta">' +
    D.contas.map(c => '<option value="' + c.id + '"' + ((m0 && contaDe(m0) === c.id) ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('') + '</select></div>' +

    '<label for="f-cat">Categoria</label><select id="f-cat"></select>' +

    '<div id="bloco-cred" class="hide"><label>Forma de pagamento</label>' +
    '<div class="seg" id="forma"><button data-forma="avista" aria-pressed="' + (forma === 'avista') + '">À vista</button>' +
    '<button data-forma="parcelado" aria-pressed="' + (forma === 'parcelado') + '">Parcelado</button></div>' +
    '<div id="bloco-parc" class="hide"><div class="two">' +
    '<div><label for="f-ini">Parcela atual</label>' +
    '<input id="f-ini" type="number" min="1" max="60" step="1" value="' + inicio + '"></div>' +
    '<div><label for="f-parc">Total de parcelas</label>' +
    '<input id="f-parc" type="number" min="2" max="60" step="1" value="' + (nOrig > 1 ? nOrig : 2) + '"></div></div>' +
    '<p class="tiny" style="margin:7px 0 0">Deixe 1 para uma compra nova. Para uma compra que já está correndo, ' +
    'informe a parcela que vem agora — as anteriores não são lançadas.</p></div></div>' +

    '<div id="bloco-rep"><label for="f-rep">Repetir todo mês por</label><select id="f-rep">' +
    repOpts.map(v => '<option value="' + v + '"' + (v === repOrig ? ' selected' : '') + '>' +
      (v === 1 ? 'não repetir' : v + ' meses') + '</option>').join('') + '</select></div>' +

    '<div class="aviso" id="f-aviso"></div>' +
    '<button class="primary" id="f-salvar">' + (t ? 'Salvar alterações' : confirmando ? 'Confirmar lançamento' : 'Salvar lançamento') + '</button>' +
    (confirmando ? '<button class="ghost" id="f-pular">Pular este mês</button>' : '') +
    (t ? '<button class="ghost" id="f-excluir">Excluir</button>' : '') +
    '<button class="ghost" id="f-cancel">Cancelar</button>');

  const drawMeios = () => {
    const sel = document.getElementById('f-meio');
    sel.innerHTML = meios.map(m => '<option value="' + m.id + '"' + (m.id === meio ? ' selected' : '') + '>' + m.icone + ' ' + esc(m.nome) + '</option>').join('');
    sel.onchange = () => { meio = sel.value; sync(); };
  };
  const drawCats = () => {
    const sel = document.getElementById('f-cat');
    sel.innerHTML = D.cats.filter(c => tipo === 'receita' ? c.receita : !c.receita)
      .map(c => '<option value="' + c.id + '"' + (c.id === catId ? ' selected' : '') + '>' + c.icone + ' ' + esc(c.nome) + '</option>').join('');
    sel.onchange = () => { catId = sel.value; };
  };

  // ao trocar o escopo, o campo de valor muda de significado
  function ajustaValor() {
    const val = document.getElementById('f-val'), lab = document.getElementById('lab-val');
    const labData = document.getElementById('lab-data');
    if (!t) { lab.textContent = 'Valor total (R$)'; return; }
    if (escopo === 'uma') {
      lab.textContent = t.parc ? 'Valor desta parcela (R$)' : 'Valor (R$)';
      labData.textContent = 'Data';
      val.value = brlNum(t.valor);
      document.getElementById('f-data').value = t.data;
    } else if (t.parc && iniOrig > 1) {
      lab.textContent = 'Valor de cada parcela (R$)';
      val.value = brlNum(t.valor);
      document.getElementById('f-mes').value = compGrupo;
    } else {
      lab.textContent = t.parc ? 'Valor total da compra (R$)' : 'Valor de cada mês (R$)';
      labData.textContent = t.parc ? 'Data da compra' : 'Data da primeira';
      val.value = brlNum(t.parc ? Math.round(t.valor * nOrig * 100) / 100 : t.valor);
      document.getElementById('f-data').value = dataGrupo || t.data;
    }
  }

  function sync() {
    const isCartao = meio.indexOf('cartao:') === 0 && tipo === 'despesa';
    const soUma = temGrupo && escopo === 'uma';

    const parcelando = isCartao && forma === 'parcelado' && !soUma;
    // em andamento: o total da compra não se aplica, só o valor da parcela
    const andamento = parcelando && inicio > 1;
    document.getElementById('bloco-cred').classList.toggle('hide', !isCartao || soUma);
    document.getElementById('bloco-conta').classList.toggle('hide', isCartao);
    document.getElementById('bloco-rep').classList.toggle('hide', soUma || confirmando || (isCartao && forma === 'parcelado'));
    document.getElementById('bloco-parc').classList.toggle('hide', soUma || !(isCartao && forma === 'parcelado'));
    document.getElementById('bloco-base').classList.toggle('hide', !parcelando || andamento);
    document.getElementById('f-data').classList.toggle('hide', andamento);
    document.getElementById('f-mes').classList.toggle('hide', !andamento);
    document.getElementById('lab-data').textContent = andamento ? 'Mês desta parcela' : (t && t.parc && escopo === 'todas' ? 'Data da compra' : 'Data');
    if (parcelando) document.getElementById('lab-val').textContent =
      (andamento ? 'Valor da parcela (R$)' : base === 'parcela' ? 'Valor de cada parcela (R$)' : 'Valor total da compra (R$)');

    const data = document.getElementById('f-data').value;
    const av = document.getElementById('f-aviso');

    if (soUma) {
      av.textContent = 'Alterando apenas esta ' + (t.parc ? 'parcela' : 'ocorrência') +
        '. As outras ' + (irmaos.length - 1) + ' ficam como estão.';
      return;
    }
    if (isCartao && andamento) {
      const c = cartao(meio.slice(7));
      const comp = document.getElementById('f-mes').value;
      const n = Math.max(2, parseInt(document.getElementById('f-parc').value) || 2);
      const ini = Math.max(1, parseInt(document.getElementById('f-ini').value) || 1);
      if (ini > n) {
        av.textContent = 'A parcela atual (' + ini + ') não pode ser maior que o total (' + n + ').';
        return;
      }
      const quantas = n - ini + 1;
      const v = num(document.getElementById('f-val').value);
      if (!comp) { av.textContent = 'Informe o mês desta parcela.'; return; }
      const p = comp.split('-');
      const ult = somaComp(comp, quantas - 1).split('-');
      let txt = 'Lança ' + quantas + ' parcela' + (quantas === 1 ? '' : 's') + ': da ' + ini + '/' + n +
        ' em ' + MES[Number(p[1]) - 1] + '/' + p[0] + ' até a ' + n + '/' + n +
        ' em ' + MES[Number(ult[1]) - 1] + '/' + ult[0] + '.';
      if (isFinite(v) && v > 0) txt += ' Total a lançar ' + brl(Math.round(v * quantas * 100) / 100) + '.';
      txt += ' As parcelas de 1 a ' + (ini - 1) + ' não entram — meses anteriores ficam intocados.';
      txt += ' Vence dia ' + c.vencimento + '.';
      if (t) txt += ' As ' + irmaos.length + ' linhas antigas são substituídas.';
      av.textContent = txt;
    } else if (isCartao && data) {
      const c = cartao(meio.slice(7));
      const comp = competenciaCartao(c, data);
      const n = forma === 'parcelado' ? Math.max(2, parseInt(document.getElementById('f-parc').value) || 2) : 1;
      const p = comp.split('-');
      let txt = 'Cai na fatura de ' + MES[Number(p[1]) - 1] + '/' + p[0] +
        ', que vence em ' + vencimentoDe(c, comp).split('-').reverse().join('/') + '.';
      if (n > 1) {
        const ult = competenciaCartao(c, data, n - 1).split('-');
        const v = num(document.getElementById('f-val').value);
        if (isFinite(v) && v > 0) {
          const parcela = base === 'parcela' ? v : Math.round(v / n * 100) / 100;
          const total = base === 'parcela' ? Math.round(v * n * 100) / 100 : v;
          txt = n + 'x de ' + brl(parcela) + ' · total ' + brl(total) + '. ' + txt;
          txt += ' A última parcela cai em ' + MES[Number(ult[1]) - 1] + '/' + ult[0] + '.';
        } else {
          txt += ' Informe o valor para ver as parcelas.';
        }
      }
      if (t) txt += ' As ' + irmaos.length + ' linhas antigas são substituídas.';
      av.textContent = txt;
    } else if (tipo === 'despesa') {
      av.textContent = 'Sai da conta na data do lançamento — não passa por fatura.' +
        (t && temGrupo ? ' As ' + irmaos.length + ' linhas antigas são substituídas.' : '');
    } else {
      av.textContent = 'Entra na conta na data do lançamento.';
    }
  }

  drawMeios(); drawCats(); ajustaValor(); sync();

  /* sugestões: descrições já usadas, só do mesmo tipo (despesa/receita), mais usadas primeiro */
  const fdesc = document.getElementById('f-desc'), fsug = document.getElementById('f-sug');
  function sugestoes(q) {
    const nq = norm(q.trim()), mapa = {};
    D.lanc.forEach(x => {
      if (x.tipo !== tipo || !x.desc || !String(x.desc).trim()) return;
      const k = norm(String(x.desc).trim());
      const m = mapa[k] || (mapa[k] = { k: k, n: 0, ult: x });
      m.n++; if (x.data > m.ult.data) m.ult = x;
    });
    let l = Object.keys(mapa).map(k => mapa[k]);
    if (nq) l = l.filter(s2 => s2.k.indexOf(nq) >= 0 && s2.k !== nq);
    l.sort((a, b) => ((b.k.indexOf(nq) === 0) - (a.k.indexOf(nq) === 0)) || b.n - a.n || b.ult.data.localeCompare(a.ult.data));
    return l.slice(0, nq ? 6 : 5);
  }
  function mostraSug() {
    const l = sugestoes(fdesc.value);
    fsug.classList.toggle('hide', !l.length);
    fsug.innerHTML = l.map((s2, i) => '<button type="button" class="chip" data-sug="' + i + '" tabindex="-1">' + esc(String(s2.ult.desc).trim()) + '</button>').join('');
    fsug.querySelectorAll('[data-sug]').forEach(b => {
      b.onpointerdown = e => e.preventDefault();
      b.onmousedown = e => e.preventDefault();
      b.onclick = () => {
        const s2 = l[Number(b.dataset.sug)];
        fdesc.value = String(s2.ult.desc).trim();
        if (!t) {   // lançamento novo: já marca a categoria usada da última vez; na edição, não mexe
          const c = D.cats.find(c2 => c2.id === s2.ult.catId && (tipo === 'receita' ? c2.receita : !c2.receita));
          if (c) { catId = c.id; drawCats(); }
        }
        fsug.classList.add('hide');
        const fv = document.getElementById('f-val'); if (fv && !fv.value) fv.focus();
        sync();
      };
    });
  }
  let tBlur = null;
  fdesc.addEventListener('focus', () => { clearTimeout(tBlur); mostraSug(); });
  fdesc.addEventListener('input', mostraSug);
  fdesc.addEventListener('blur', () => { clearTimeout(tBlur); tBlur = setTimeout(() => fsug.classList.add('hide'), 300); });

  document.querySelectorAll('#escopo button').forEach(b => b.onclick = () => {
    escopo = b.dataset.escopo;
    document.querySelectorAll('#escopo button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    ajustaValor(); sync();
  });
  document.querySelectorAll('#tipo button').forEach(b => b.onclick = () => {
    if (b.dataset.tipo === 'transf') { sheetTransf(null); return; }
    tipo = b.dataset.tipo;
    document.querySelectorAll('#tipo button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if (!D.cats.filter(c => tipo === 'receita' ? c.receita : !c.receita).some(c => c.id === catId))
      catId = (D.cats.find(c => tipo === 'receita' ? c.receita : !c.receita) || {}).id;
    if (tipo === 'receita' && meio.indexOf('cartao:') === 0) { meio = 'pix'; drawMeios(); }
    drawCats(); sync();
  });
  document.querySelectorAll('#base button').forEach(b => b.onclick = () => {
    base = b.dataset.base;
    document.querySelectorAll('#base button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    sync();
  });
  document.querySelectorAll('#forma button').forEach(b => b.onclick = () => {
    forma = b.dataset.forma;
    document.querySelectorAll('#forma button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    sync();
  });
  document.getElementById('f-data').onchange = sync;
  document.getElementById('f-mes').onchange = sync;
  document.getElementById('f-val').oninput = sync;
  document.getElementById('f-parc').oninput = sync;
  document.getElementById('f-ini').oninput = function () {
    inicio = Math.max(1, parseInt(this.value) || 1);
    sync();
  };
  document.getElementById('f-cancel').onclick = closeSheet;
  const fpu = document.getElementById('f-pular'); if (fpu) fpu.onclick = () => pularPrevisto(modelo.rid, modelo.mm);

  const ex = document.getElementById('f-excluir');
  if (ex) ex.onclick = async () => {
    const grupo = temGrupo && confirm('Remover também as outras ' + (irmaos.length - 1) + '?') ? t.grupo : null;
    D.lanc = D.lanc.filter(x => grupo ? x.grupo !== grupo : x.id !== t.id);
    closeSheet(); render();
    try { await api('delLanc', t.id, grupo); } catch (e) { toast('Erro ao excluir'); carregar(); }
  };

  document.getElementById('f-salvar').onclick = async function () {
    const desc = document.getElementById('f-desc').value.trim();
    const valor = num(document.getElementById('f-val').value);
    const data = document.getElementById('f-data').value;
    const compMes = document.getElementById('f-mes').value;
    const usaMes = !document.getElementById('f-mes').classList.contains('hide');
    if (!desc) { alert('Preencha a descrição.'); return; }
    if (usaMes ? !compMes : !data) { alert(usaMes ? 'Informe o mês desta parcela.' : 'Informe a data.'); return; }
    if (!isFinite(valor) || !(valor > 0)) { alert('Valor inválido. Use números, vírgula decimal, ou uma conta como 35,40+12,90.'); return; }

    const isCartao = meio.indexOf('cartao:') === 0 && tipo === 'despesa';
    const c = isCartao ? cartao(meio.slice(7)) : null;
    const soUma = temGrupo && escopo === 'uma';
    const contaId = isCartao ? null : document.getElementById('f-conta').value;

    this.disabled = true; this.textContent = 'Salvando…';

    /* --- editar apenas uma linha --- */
    if (t && soUma) {
      const comp = isCartao ? competenciaCartao(c, data) : data.slice(0, 7);
      const campos = {
        desc: desc, valor: Math.round(valor * 100) / 100, data: data, comp: comp, tipo: tipo,
        catId: catId, meio: isCartao ? 'cartao' : meio,
        cartao: isCartao ? c.id : null, conta: contaId
      };
      Object.assign(t, campos);
      closeSheet(); render();
      try { await api('updLanc', t.id, campos); toast('Lançamento atualizado' + avisoOrcItens([t])); }
      catch (e) { toast('Falhou ao salvar'); carregar(); }
      return;
    }

    /* --- criar, ou refazer o grupo inteiro --- */
    const n = (isCartao && forma === 'parcelado') ? Math.max(2, Math.min(60, parseInt(document.getElementById('f-parc').value) || 2)) : 1;
    const ini = (n > 1) ? Math.max(1, parseInt(document.getElementById('f-ini').value) || 1) : 1;
    if (ini > n) { alert('A parcela atual (' + ini + ') não pode ser maior que o total (' + n + ').'); return; }
    const emAndamento = isCartao && n > 1 && ini > 1;
    const rep = (!isCartao || forma === 'avista') ? (parseInt(document.getElementById('f-rep').value) || 1) : 1;
    const dBase = new Date((emAndamento ? (compMes + '-01') : data) + 'T12:00:00');
    const vezes = n > 1 ? (n - ini + 1) : rep;
    const grupo = vezes > 1 ? uid() : null;
    // valor da parcela informado é exato; o total é que é derivado. Em andamento é sempre por parcela.
    const vparc = n > 1
      ? ((emAndamento || base === 'parcela') ? Math.round(valor * 100) / 100 : Math.round(valor / n * 100) / 100)
      : Math.round(valor * 100) / 100;
    const itens = [];
    const recKey = t ? (t.rec || null) : (confirmando ? modelo.rec : null);

    for (let i = 0; i < vezes; i++) {
      let dataI, comp;
      if (emAndamento) {
        comp = somaComp(compMes, i);
        dataI = comp + '-01';          // a data original da compra não é conhecida
      } else if (isCartao) {
        dataI = data;
        comp = competenciaCartao(c, data, i);
      } else {
        const d2 = new Date(dBase.getFullYear(), dBase.getMonth() + i, Math.min(dBase.getDate(), 28));
        dataI = d2.getFullYear() + '-' + String(d2.getMonth()+1).padStart(2,'0') + '-' + String(d2.getDate()).padStart(2,'0');
        comp = dataI.slice(0, 7);
      }
      itens.push({
        id: uid(), grupo: grupo, desc: desc, valor: vparc, tipo: tipo, catId: catId,
        data: dataI, comp: comp,
        meio: isCartao ? 'cartao' : meio, cartao: isCartao ? c.id : null, conta: contaId,
        parc: n > 1 ? { i: ini + i, n: n } : null,
        fixo: (n === 1 && rep > 1) || (!temGrupo && !!(t && t.fixo)) || (confirmando && !!modelo.fixo),
        destino: null, rec: i === 0 ? recKey : null
      });
    }

    if (t) {
      const alvoGrupo = temGrupo ? t.grupo : null;
      D.lanc = D.lanc.filter(x => alvoGrupo ? x.grupo !== alvoGrupo : x.id !== t.id);
      D.lanc = D.lanc.concat(itens);
      closeSheet(); render();
      try { await api('substituirLanc', t.id, alvoGrupo, itens); toast('Lançamento atualizado' + avisoOrcItens(itens)); }
      catch (e) { toast('Falhou ao salvar'); carregar(); }
    } else {
      D.lanc = D.lanc.concat(itens);
      closeSheet(); render();
      try { await api('addLanc', itens); toast((confirmando ? 'Confirmado' : 'Salvo na planilha') + avisoOrcItens(itens)); }
      catch (e) { toast('Falhou ao salvar'); carregar(); }
    }
  };
}

/* ---------- transferência, ajuste de saldo e recorrentes ---------- */

const opcoesContas = (sel, exceto) => D.contas.filter(c => c.id !== exceto)
  .map(c => '<option value="' + c.id + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nome) + (c.reserva && !/reserva/i.test(c.nome) ? ' (reserva)' : '') + '</option>').join('');

function sheetTransf(editId, modelo) {
  if (exigeBackend()) return;
  if (D.contas.length < 2) {
    openSheet('<h2>Transferência</h2>' +
      '<div class="aviso">Para transferir você precisa de pelo menos duas contas — por exemplo a conta corrente e uma “Reserva” ou “Investimentos”. ' +
      'Cadastre a outra e marque como reserva se quiser esse dinheiro fora do “pode gastar por dia”.</div>' +
      '<button class="primary" id="tr-conta">Adicionar conta</button><button class="ghost" id="tr-fechar">Fechar</button>');
    document.getElementById('tr-conta').onclick = () => sheetConta(null);
    document.getElementById('tr-fechar').onclick = closeSheet;
    return;
  }
  const t = editId ? D.lanc.find(x => x.id === editId) : null;
  const m0 = t || modelo || {};
  const origem0 = t ? contaDe(t) : (m0.origem || D.contas[0].id);
  const destino0 = t ? t.destino : (m0.destino && m0.destino !== origem0 ? m0.destino : (D.contas.find(c => c.id !== origem0) || {}).id);
  openSheet('<h2>' + (t ? 'Editar transferência' : 'Transferência entre contas') + '</h2>' +
    '<div class="two"><div><label for="tr-de">Sai de</label><select id="tr-de">' + opcoesContas(origem0) + '</select></div>' +
    '<div><label for="tr-para">Entra em</label><select id="tr-para">' + opcoesContas(destino0) + '</select></div></div>' +
    '<div class="two"><div><label for="tr-val">Valor (R$)</label>' +
    '<input id="tr-val" type="text" inputmode="decimal" placeholder="0,00" value="' + (m0.valor ? brlNum(m0.valor) : '') + '"></div>' +
    '<div><label for="tr-data">Data</label><input id="tr-data" type="date" value="' + (t ? t.data : hojeISO()) + '"></div></div>' +
    '<label for="tr-desc">Descrição (opcional)</label><input id="tr-desc" autocomplete="off" placeholder="Transferência" value="' + esc(t && t.desc !== 'Transferência' ? t.desc : (m0.desc && m0.desc !== 'Transferência' ? m0.desc : '')) + '">' +
    '<div class="aviso" id="tr-aviso"></div>' +
    '<button class="primary" id="tr-salvar">' + (t ? 'Salvar alterações' : 'Registrar transferência') + '</button>' +
    (t ? '<button class="ghost" id="tr-excluir">Excluir</button>' : '') +
    '<button class="ghost" id="tr-cancel">Cancelar</button>');
  const de = document.getElementById('tr-de'), para = document.getElementById('tr-para');
  const av = document.getElementById('tr-aviso');
  function sync() {
    const v = num(document.getElementById('tr-val').value), a = conta(de.value), b = conta(para.value);
    let txt = 'Move o dinheiro entre as contas. Não conta como receita nem como despesa, então não mexe na sobra do mês.';
    if (de.value === para.value) txt = 'Escolha duas contas diferentes.';
    else if (isFinite(v) && v > 0 && a && b) {
      txt = 'Tira ' + brl(v) + ' de ' + a.nome + ' e coloca em ' + b.nome + '. Não conta como receita nem despesa.';
      if (b.reserva && !a.reserva) txt += ' ' + b.nome + ' é reserva: esse valor sai do que você pode gastar.';
      if (a.reserva && !b.reserva) txt += ' ' + a.nome + ' é reserva: esse valor volta a contar como disponível.';
    }
    av.textContent = txt;
  }
  sync();
  de.onchange = sync; para.onchange = sync; document.getElementById('tr-val').oninput = sync;
  document.getElementById('tr-cancel').onclick = closeSheet;
  const ex = document.getElementById('tr-excluir');
  if (ex) ex.onclick = async () => {
    if (!confirm('Excluir esta transferência?')) return;
    D.lanc = D.lanc.filter(x => x.id !== t.id); closeSheet(); render();
    try { await api('delLanc', t.id, null); toast('Excluída'); } catch (e) { toast('Erro ao excluir'); carregar(); }
  };
  document.getElementById('tr-salvar').onclick = async function () {
    const v = num(document.getElementById('tr-val').value), data = document.getElementById('tr-data').value;
    if (de.value === para.value) { alert('Escolha duas contas diferentes.'); return; }
    if (!isFinite(v) || !(v > 0)) { alert('Informe um valor maior que zero.'); return; }
    if (!data) { alert('Informe a data.'); return; }
    this.disabled = true; this.textContent = 'Salvando…';
    const item = {
      id: t ? t.id : uid(), grupo: null, desc: document.getElementById('tr-desc').value.trim() || 'Transferência',
      valor: Math.round(v * 100) / 100, tipo: 'transf', catId: 'transf', data: data, comp: data.slice(0, 7),
      meio: 'pix', cartao: null, conta: de.value, destino: para.value, parc: null, fixo: false, rec: null
    };
    if (t) D.lanc = D.lanc.filter(x => x.id !== t.id);
    D.lanc = D.lanc.concat([item]);
    closeSheet(); render();
    try {
      if (t) await api('substituirLanc', t.id, null, [item]); else await api('addLanc', [item]);
      toast(t ? 'Transferência atualizada' : 'Transferência registrada');
    } catch (e) { toast('Falhou ao salvar'); carregar(); }
  };
}

function sheetAjuste(contaId, editId) {
  if (exigeBackend()) return;
  const t = editId ? D.lanc.find(x => x.id === editId) : null;
  const c = conta(t ? contaDe(t) : contaId);
  if (!c) return;

  if (t) {   // corrigir ou apagar um ajuste que já existe
    openSheet('<h2>Editar ajuste de saldo</h2>' +
      '<p class="tiny" style="margin:0 0 4px">' + esc(c.nome) + '</p>' +
      '<div class="two"><div><label for="aj-val">Diferença (R$)</label>' +
      '<input id="aj-val" type="text" inputmode="decimal" value="' + brlNum(t.valor) + '"></div>' +
      '<div><label for="aj-data">Data</label><input id="aj-data" type="date" value="' + t.data + '"></div></div>' +
      '<div class="aviso">Positivo soma ao saldo; negativo subtrai. Não conta como receita nem despesa.</div>' +
      '<button class="primary" id="aj-salvar">Salvar alterações</button>' +
      '<button class="ghost" id="aj-excluir">Excluir ajuste</button><button class="ghost" id="aj-cancel">Cancelar</button>');
    document.getElementById('aj-cancel').onclick = closeSheet;
    document.getElementById('aj-excluir').onclick = async () => {
      if (!confirm('Excluir este ajuste? O saldo volta ao que era antes dele.')) return;
      D.lanc = D.lanc.filter(x => x.id !== t.id); closeSheet(); render();
      try { await api('delLanc', t.id, null); toast('Excluído'); } catch (e) { toast('Erro ao excluir'); carregar(); }
    };
    document.getElementById('aj-salvar').onclick = async function () {
      const v = num(document.getElementById('aj-val').value), data = document.getElementById('aj-data').value;
      if (!isFinite(v) || Math.abs(v) < 0.005) { alert('Informe uma diferença diferente de zero.'); return; }
      if (!data) { alert('Informe a data.'); return; }
      this.disabled = true;
      const campos = { valor: Math.round(v * 100) / 100, data: data, comp: data.slice(0, 7) };
      Object.assign(t, campos); closeSheet(); render();
      try { await api('updLanc', t.id, campos); toast('Ajuste atualizado'); } catch (e) { toast('Falhou ao salvar'); carregar(); }
    };
    return;
  }

  const atual = Math.round(saldoConta(c.id) * 100) / 100;
  openSheet('<h2>Ajustar saldo</h2>' +
    '<p class="tiny" style="margin:0 0 4px">' + esc(c.nome) + '</p>' +
    '<p class="tiny" style="margin:0">O app calcula hoje: <b>' + brl(atual) + '</b></p>' +
    '<label for="aj-real">Saldo real agora, no banco (R$)</label>' +
    '<input id="aj-real" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">' +
    '<div class="aviso" id="aj-aviso">Digite o saldo que aparece no seu banco. O app cria um ajuste com a diferença.</div>' +
    '<button class="primary" id="aj-salvar">Ajustar saldo</button><button class="ghost" id="aj-cancel">Cancelar</button>');
  const inp = document.getElementById('aj-real'), av = document.getElementById('aj-aviso');
  const dif = () => { const v = num(inp.value); return isFinite(v) ? Math.round((v - atual) * 100) / 100 : NaN; };
  inp.oninput = () => {
    const d = dif();
    av.textContent = isNaN(d) ? 'Digite o saldo que aparece no seu banco. O app cria um ajuste com a diferença.'
      : Math.abs(d) < 0.005 ? 'O saldo já confere — não há o que ajustar.'
      : 'Cria um ajuste de ' + (d > 0 ? '+' : '') + brl(d) + ' hoje. Não conta como receita nem despesa.';
  };
  document.getElementById('aj-cancel').onclick = closeSheet;
  document.getElementById('aj-salvar').onclick = async function () {
    const d = dif();
    if (isNaN(d)) { alert('Informe o saldo real.'); return; }
    if (Math.abs(d) < 0.005) { alert('O saldo já confere — não há o que ajustar.'); return; }
    this.disabled = true; this.textContent = 'Salvando…';
    const hoje = hojeISO();
    const item = { id: uid(), grupo: null, desc: 'Ajuste de saldo', valor: d, tipo: 'ajuste', catId: 'ajuste', data: hoje, comp: hoje.slice(0, 7),
      meio: 'pix', cartao: null, conta: c.id, destino: null, parc: null, fixo: false, rec: null };
    D.lanc = D.lanc.concat([item]); closeSheet(); render();
    try { await api('addLanc', [item]); toast('Saldo ajustado'); } catch (e) { toast('Falhou ao salvar'); carregar(); }
  };
}

function sheetRecorrente(id) {

  const r0 = id ? recs().find(x => x.id === id) : null;
  const r = r0 || { id: uid(), desc: '', valor: 0, tipo: 'despesa', catId: (D.cats.find(c => !c.receita) || {}).id, meio: 'pix', cartao: null,
    conta: (D.contas[0] || {}).id, dia: new Date().getDate(), inicio: mk(new Date()), fim: null, ativo: true, fixo: false, pulados: [] };
  let tipo = r.tipo, catId = r.catId, meio = r.meio === 'cartao' && r.cartao ? 'cartao:' + r.cartao : r.meio, ativo = r.ativo, fixo = r.fixo;
  const meios = [{ id: 'pix', nome: 'Pix', icone: '⚡' }, { id: 'debito', nome: 'Débito', icone: '💳' }, { id: 'dinheiro', nome: 'Dinheiro', icone: '💵' }]
    .concat(D.cartoes.map(c => ({ id: 'cartao:' + c.id, nome: c.nome, icone: '▭' })));

  openSheet('<h2>' + (r0 ? 'Editar recorrente' : 'Novo recorrente') + '</h2>' +
    '<div class="seg" id="rc-tipo"><button data-rct="despesa" aria-pressed="' + (tipo === 'despesa') + '">Despesa</button>' +
    '<button data-rct="receita" aria-pressed="' + (tipo === 'receita') + '">Receita</button></div>' +

    '<div class="two"><div><label for="rc-val">Valor estimado (R$)</label>' +

    '<div><label for="rc-dia">Dia do mês</label><input id="rc-dia" type="number" min="1" max="31" step="1" value="' + r.dia + '"></div></div>' +
    '<label for="rc-cat">Categoria</label><select id="rc-cat"></select>' +
    '<label for="rc-meio">Como é pago</label><select id="rc-meio"></select>' +
    '<div id="rc-bconta"><label for="rc-conta">Conta</label><select id="rc-conta">' +
      D.contas.map(c => '<option value="' + c.id + '"' + (c.id === r.conta ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('') + '</select></div>' +
    '<div class="two"><div><label for="rc-ini">Começa em</label><input id="rc-ini" type="month" value="' + (r.inicio || mk(new Date())) + '"></div>' +
    '<div><label for="rc-fim">Termina em (opcional)</label><input id="rc-fim" type="month" value="' + (r.fim || '') + '"></div></div>' +
    '<label>Conta fixa?</label><div class="seg" id="rc-fixo"><button data-rcf="0" aria-pressed="' + (!fixo) + '">Variável</button>' +
    '<button data-rcf="1" aria-pressed="' + fixo + '">Fixa</button></div>' +
    (r0 ? '<label>Situação</label><div class="seg" id="rc-ativo"><button data-rca="1" aria-pressed="' + ativo + '">Ativo</button>' +
      '<button data-rca="0" aria-pressed="' + (!ativo) + '">Pausado</button></div>' : '') +
    '<div class="aviso">Todo mês aparece em “A confirmar” para você conferir valor e data. Nada é lançado sozinho. ' +
    '“Fixa” (aluguel, assinatura) fica fora do ritmo de gasto diário.</div>' +
    '<button class="primary" id="rc-salvar">' + (r0 ? 'Salvar alterações' : 'Salvar recorrente') + '</button>' +
    (r0 ? '<button class="ghost" id="rc-excluir">Excluir recorrente</button>' : '') +
    '<button class="ghost" id="rc-cancel">Cancelar</button>');

  const drawCats = () => {
    const sel = document.getElementById('rc-cat'), lista = D.cats.filter(c => tipo === 'receita' ? c.receita : !c.receita);
    if (!lista.some(c => c.id === catId)) catId = (lista[0] || {}).id;
    sel.innerHTML = lista.map(c => '<option value="' + c.id + '"' + (c.id === catId ? ' selected' : '') + '>' + c.icone + ' ' + esc(c.nome) + '</option>').join('');
    sel.onchange = () => { catId = sel.value; };
  };
  const drawMeios = () => {
    const sel = document.getElementById('rc-meio'), lista = meios.filter(m => tipo === 'despesa' || m.id.indexOf('cartao:') !== 0);
    if (!lista.some(m => m.id === meio)) meio = 'pix';
    sel.innerHTML = lista.map(m => '<option value="' + m.id + '"' + (m.id === meio ? ' selected' : '') + '>' + m.icone + ' ' + esc(m.nome) + '</option>').join('');
    sel.onchange = () => { meio = sel.value; mostraConta(); };
    mostraConta();
  };
  const mostraConta = () => document.getElementById('rc-bconta').classList.toggle('hide', meio.indexOf('cartao:') === 0);
  drawCats(); drawMeios();

  const pares = (sel, fn) => document.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => {
    fn(b); document.querySelectorAll(sel + ' button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  pares('#rc-tipo', b => { tipo = b.dataset.rct; drawCats(); drawMeios(); });
  pares('#rc-fixo', b => { fixo = b.dataset.rcf === '1'; });
  if (r0) pares('#rc-ativo', b => { ativo = b.dataset.rca === '1'; });
  document.getElementById('rc-cancel').onclick = closeSheet;

  const ex = document.getElementById('rc-excluir');
  if (ex) ex.onclick = async () => {
    if (!confirm('Excluir este recorrente? Os lançamentos que você já confirmou continuam.')) return;
    D.recs = recs().filter(x => x.id !== r.id); closeSheet(); render();
    try { await api('delRecorrente', r.id); toast('Recorrente excluído'); } catch (e) { toast('Erro ao excluir'); carregar(); }
  };
  document.getElementById('rc-salvar').onclick = async function () {
    const desc = document.getElementById('rc-desc').value.trim(), valor = num(document.getElementById('rc-val').value);
    const dia = parseInt(document.getElementById('rc-dia').value), ini = document.getElementById('rc-ini').value, fim = document.getElementById('rc-fim').value;
    if (!desc) { alert('Preencha a descrição.'); return; }
    if (!isFinite(valor) || !(valor > 0)) { alert('Valor inválido. Use números e vírgula decimal.'); return; }
    if (!(dia >= 1 && dia <= 31)) { alert('O dia do mês deve estar entre 1 e 31.'); return; }
    if (!ini) { alert('Informe quando começa.'); return; }
    if (fim && fim < ini) { alert('O fim não pode ser antes do início.'); return; }
    this.disabled = true;
    const isCartao = meio.indexOf('cartao:') === 0 && tipo === 'despesa';
    const novo = { id: r.id, desc: desc, valor: Math.round(valor * 100) / 100, tipo: tipo, catId: catId,
      meio: isCartao ? 'cartao' : meio, cartao: isCartao ? meio.slice(7) : null,
      conta: isCartao ? null : document.getElementById('rc-conta').value,
      dia: dia, inicio: ini, fim: fim || null, ativo: ativo, fixo: fixo, pulados: r.pulados || [] };
    const lista = recs().slice(), i = lista.findIndex(x => x.id === r.id);
    if (i >= 0) lista[i] = novo; else lista.push(novo);
    D.recs = lista; closeSheet(); render();
    try { await api('salvarRecorrente', novo); toast('Recorrente salvo'); } catch (e) { toast('Falhou ao salvar'); carregar(); }
  };
}

  const drawIcones = () => {
    document.querySelectorAll('[data-icone]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.icone === icone)));
    document.getElementById('ct-icone').value = icone;
  };
  document.querySelectorAll('[data-icone]').forEach(b => b.onclick = () => { icone = b.dataset.icone; drawIcones(); });
  document.getElementById('ct-icone').oninput = function () { icone = this.value.trim() || '•'; drawIcones(); };
  document.querySelectorAll('#ct-tipo button').forEach(b => b.onclick = () => {
    receita = b.dataset.ct === 'receita';
    document.querySelectorAll('#ct-tipo button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  document.getElementById('ct-cancel').onclick = closeSheet;

  const ex = document.getElementById('ct-excluir');
  if (ex) ex.onclick = async () => {
    let mover = null;
    if (emUso) {
      if (!destinos.length) {
        alert('Não dá para excluir: há ' + emUso + ' lançamento(s) nesta categoria e nenhuma outra categoria do mesmo tipo para recebê-los.');
        return;
      }
      const lista = destinos.map((d, i) => (i + 1) + ') ' + d.nome).join('\n');
      const r = prompt('Há ' + emUso + ' lançamento(s) nesta categoria.\nPara qual categoria movê-los? Digite o número:\n\n' + lista, '1');
      const idx = parseInt(r) - 1;
      if (!(idx >= 0 && idx < destinos.length)) return;
      mover = destinos[idx].id;
    } else if (!confirm('Excluir a categoria "' + c.nome + '"?')) return;

    if (mover) D.lanc.forEach(t => { if (t.catId === id) t.catId = mover; });
    D.cats = D.cats.filter(x => x.id !== id);
    delete D.orcs[id];
    closeSheet(); render();
    try { await api('delCategoria', id, mover); toast(mover ? 'Categoria excluída e lançamentos movidos' : 'Categoria excluída'); }
    catch (e) { toast('Erro ao excluir'); carregar(); }
  };

  document.getElementById('ct-salvar').onclick = async function () {
    const nome = document.getElementById('ct-nome').value.trim();
    if (!nome) { alert('Dê um nome à categoria.'); return; }
    this.disabled = true;
    const novo = {
      id: c.id, nome: nome, icone: icone || '•',
      cor: document.getElementById('ct-cor').value, receita: receita
    };
    const i = D.cats.findIndex(x => x.id === c.id);
    if (i >= 0) D.cats[i] = novo; else D.cats.push(novo);
    closeSheet(); render();
    try {
      await api('salvarCategoria', { id: novo.id, nome: novo.nome, icone: novo.icone, cor: novo.cor, tipo: receita ? 'receita' : 'despesa' });
      toast('Categoria salva');
    } catch (e) { toast('Falhou ao salvar'); carregar(); }
  };
}

/* ---------- pagamento de fatura ---------- */

function sheetPagamento(cartaoId, comp) {
  const c = cartao(cartaoId);
  const st = situacao(c, comp);
  if (!st.pagavel) { toast('Esta fatura ainda não abriu — abre em ' + dataBR(st.abre)); return; }
  const p = comp.split('-');
  const hoje = hojeISO();

  openSheet('<h2>Pagar fatura</h2>' +
    '<p class="tiny" style="margin:0 0 4px">' + esc(c.nome) + ' · fatura de ' + MES[Number(p[1]) - 1] + '/' + p[0] +
    ' · vence ' + vencimentoDe(c, comp).split('-').reverse().join('/') + '</p>' +
    '<p class="tiny" style="margin:0">lançado ' + brl(st.total) +
    (st.pago > 0 ? ' · já pago ' + brl(st.pago) : '') + ' · <b>em aberto ' + brl(Math.max(0, st.resta)) + '</b></p>' +

    '<label>Quanto está pagando</label>' +
    '<div class="seg" id="quanto"><button data-quanto="total" aria-pressed="true">Valor total</button>' +
    '<button data-quanto="parcial" aria-pressed="false">Valor parcial</button></div>' +
    '<input id="p-val" type="number" inputmode="decimal" step="0.01" min="0" value="' +
      (st.resta > 0 ? st.resta.toFixed(2) : '') + '" style="margin-top:10px">' +

    '<div class="two"><div><label for="p-data">Data do pagamento</label>' +
    '<input id="p-data" type="date" value="' + hoje + '"></div>' +
    '<div><label for="p-conta">Sai da conta</label><select id="p-conta">' +
    D.contas.map(k2 => '<option value="' + k2.id + '"' + ((c.conta || (D.contas[0]||{}).id) === k2.id ? ' selected' : '') + '>' +
      esc(k2.nome) + '</option>').join('') + '</select></div></div>' +

    '<label for="p-obs">Observação (opcional)</label>' +
    '<input id="p-obs" placeholder="antecipado, entrada, resto da fatura…">' +

    '<div class="aviso" id="p-aviso"></div>' +
    '<button class="primary" id="p-salvar">Registrar pagamento</button>' +
    '<button class="ghost" id="p-cancel">Cancelar</button>');

  let quanto = 'total';
  const val = document.getElementById('p-val');

  function sync() {
    val.readOnly = (quanto === 'total');
    if (quanto === 'total') val.value = st.resta > 0 ? st.resta.toFixed(2) : '0';
    const v = parseFloat(val.value) || 0;
    const data = document.getElementById('p-data').value;
    const venc = vencimentoDe(c, comp);
    const sobra = Math.round((st.resta - v) * 100) / 100;
    let txt;
    if (v <= 0) txt = 'Informe um valor maior que zero.';
    else if (sobra > 0.009) txt = 'Depois deste pagamento ainda ficam ' + brl(sobra) + ' em aberto nesta fatura.';
    else if (sobra < -0.009) txt = 'Você está pagando ' + brl(-sobra) + ' a mais que o saldo da fatura — vira crédito no cartão.';
    else txt = 'Quita a fatura por completo.';
    if (data && data < venc) txt += ' Pagamento antecipado, ' +
      Math.round((new Date(venc + 'T12:00:00') - new Date(data + 'T12:00:00')) / 86400000) + ' dias antes do vencimento.';
    else if (data && data > venc) txt += ' Pagamento em atraso — juros e multa, se houver, lance à parte.';
    document.getElementById('p-aviso').textContent = txt;
  }
  sync();

  document.querySelectorAll('#quanto button').forEach(b => b.onclick = () => {
    quanto = b.dataset.quanto;
    document.querySelectorAll('#quanto button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if (quanto === 'parcial') { val.value = ''; val.focus(); }
    sync();
  });
  val.oninput = sync;
  document.getElementById('p-data').onchange = sync;
  document.getElementById('p-cancel').onclick = closeSheet;

  document.getElementById('p-salvar').onclick = async function () {
    const v = parseFloat(val.value);
    const data = document.getElementById('p-data').value;
    if (!(v > 0) || !data) { alert('Informe valor e data.'); return; }
    if (data < st.abre) { alert('Esta fatura só abriu em ' + dataBR(st.abre) + '. A data do pagamento não pode ser anterior.'); return; }
    this.disabled = true; this.textContent = 'Salvando…';
    const pg = {
      id: uid(), data: data, cartao: cartaoId, comp: comp, valor: Math.round(v * 100) / 100,
      conta: document.getElementById('p-conta').value,
      obs: document.getElementById('p-obs').value.trim()
    };
    D.pagamentos.push(pg);
    closeSheet(); render();
    try { await api('addPagamento', pg); toast('Pagamento registrado'); }
    catch (e) { toast('Falhou ao salvar'); carregar(); }
  };
}

    '<input id="m-nome" placeholder="Reserva de emergência">' +
    '<div class="two"><div><label for="m-alvo">Alvo (R$)</label>' +
    '<input id="m-alvo" type="number" inputmode="decimal" step="100" min="0" placeholder="0,00"></div>' +

/* ---------- tela de pareamento ---------- */

function telaConexao(primeira) {
  document.querySelector('nav').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
  document.getElementById('mtitle').firstChild.nodeValue = 'Caixa';
  document.getElementById('msub').textContent = 'conexão';

  document.getElementById('view').innerHTML =
    '<div class="card">' +
    '<h2>' + (primeira ? 'Conectar à sua planilha' : 'Conexão') + '</h2>' +
    '<p class="tiny" style="margin:0 0 4px">Cole o endereço do seu app do Apps Script e o token que você gerou. ' +
    'Eles ficam guardados só neste aparelho — não vão para a internet nem para o repositório.</p>' +
    '<label for="cx-url">URL do app da web</label>' +
    '<input id="cx-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(CFG.url) + '">' +
    '<label for="cx-token">Token</label>' +
    '<input id="cx-token" placeholder="cole aqui o token" value="' + esc(CFG.token) + '">' +
    '<div class="aviso" id="cx-aviso">Quem tiver esta URL e este token consegue ver e alterar seus dados. Trate como senha.</div>' +
    '<button class="primary" id="cx-testar">Conectar</button>' +
    (CFG.url && !primeira ? '<button class="ghost" id="cx-voltar">Voltar</button>' : '') +
    '</div>';

  const vb = document.getElementById('cx-voltar');
  if (vb) vb.onclick = () => { document.querySelector('nav').style.display = ''; document.getElementById('fab').style.display = ''; render(); };

  document.getElementById('cx-testar').onclick = async function () {
    const url = document.getElementById('cx-url').value.trim();
    const token = document.getElementById('cx-token').value.trim();
    const av = document.getElementById('cx-aviso');
    if (!url || !token) { av.textContent = 'Preencha os dois campos.'; return; }
    if (url.indexOf('/exec') === -1) {
      av.textContent = 'A URL precisa terminar em /exec. Se termina em /dev, você copiou o endereço de teste.';
      return;
    }
    this.disabled = true; this.textContent = 'Testando…';
    av.textContent = 'Falando com o Apps Script…';
    try {
      await chamar('ping', {}, { url: url, token: token });
      localStorage.setItem('caixa_url', url);
      localStorage.setItem('caixa_token', token);
      CFG.url = url; CFG.token = token;
      document.querySelector('nav').style.display = '';
      document.getElementById('fab').style.display = '';
      toast('Conectado');
      carregar();
    } catch (e) {
      this.disabled = false; this.textContent = 'Conectar';
      av.textContent = 'Não deu certo: ' + (e.message || e);
    }
  };
}

/* ---------- partida ---------- */

document.getElementById('fab').onclick = () => sheetLanc(null);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ---------- movimento e gestos ---------- */

const viewEl = document.getElementById('view');
function anima(keyframes, ms) {
  if (reduzMovimento() || !viewEl.animate) return;
  viewEl.animate(keyframes, { duration: ms, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function mudaMes(d) {
  cursor = new Date(cursor.getFullYear(), cursor.getMonth() + d, 1);
  selMes = null; selCat = null; animarGraf = true;
  render(); vib(10);
  anima([{ transform: 'translateX(' + (d * 36) + 'px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 240);
}
function trocaAba(nova) {
  if (nova === tab) {
    if (nova === 'carteira' && cartaoAberto) { cartaoAberto = null; faturaAberta = null; render(); window.scrollTo(0, 0); }
    return;
  }
  cartaoAberto = null; faturaAberta = null;
  if (nova !== 'lanc') limparFiltro();
  tab = nova; animarGraf = true; render();
  anima([{ transform: 'translateY(8px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 200);
}
document.getElementById('prev').onclick = () => mudaMes(-1);
document.getElementById('next').onclick = () => mudaMes(1);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => trocaAba(b.dataset.tab));

/** Puxar para atualizar */
let atualizando = false;
const pux = document.createElement('div'); pux.id = 'puxar'; document.body.appendChild(pux);
function mostraPux(txt, px, suave) {
  pux.textContent = txt;
  pux.style.transition = suave ? '' : 'none';
  pux.style.opacity = px > 6 ? '1' : '0';
  pux.style.transform = 'translate(-50%,' + (px - 70) + 'px)';
}
function escondePux() { pux.style.transition = ''; pux.style.opacity = '0'; pux.style.transform = 'translate(-50%,-70px)'; }
async function atualizar() {
  if (atualizando) return;
  atualizando = true; mostraPux('Atualizando…', 62, true); carga(true);
  const t0 = Date.now();
  try { D = await api('getTudo'); tempoCarga = Date.now() - t0; cargaEm = new Date(); offline = false; salvarCache(); render(); toast('Atualizado'); }
  catch (e) { offline = true; render(); toast('Sem conexão — dados guardados'); }
  finally { atualizando = false; escondePux(); carga(false); }
}

/** Linhas deslizáveis */
const LARG_ACOES = 192;
function fechaLinhas(exceto) {
  document.querySelectorAll('.sw .row.aberta').forEach(r => { if (r !== exceto) { r.classList.remove('aberta'); r.style.transform = ''; } });
}
function fechaLinha(r) { r.classList.remove('arrasta', 'aberta'); r.style.transform = ''; }
function abreLinha(r) { r.classList.remove('arrasta'); r.classList.add('aberta'); r.style.transform = ''; vib(8); }

async function excluirLanc(id) {
  const t = D.lanc.find(x => x.id === id); if (!t) return;
  const irmaos = t.grupo ? D.lanc.filter(x => x.grupo === t.grupo) : [];
  if (!confirm('Excluir "' + t.desc + '" (' + brl(t.valor) + ')?')) return;
  const grupo = irmaos.length > 1 && confirm('Remover também as outras ' + (irmaos.length - 1) + ' do mesmo grupo?') ? t.grupo : null;
  D.lanc = D.lanc.filter(x => grupo ? x.grupo !== grupo : x.id !== t.id);
  render();
  try { await api('delLanc', t.id, grupo); toast('Excluído'); }
  catch (e) { toast('Erro ao excluir'); carregar(); }
}

let ultimoArraste = 0;
document.addEventListener('click', ev => {
  const bt = ev.target.closest && ev.target.closest('[data-sw]');
  if (bt) {
    ev.preventDefault(); ev.stopPropagation();
    const id = bt.dataset.id, a = bt.dataset.sw;
    if (a === 'edit') editar(id);
    else if (a === 'dup') { const t = D.lanc.find(x => x.id === id); if (t && t.tipo === 'transf') sheetTransf(null, { origem: contaDe(t), destino: t.destino, desc: t.desc, valor: t.valor }); else if (t) sheetLanc(null, { tipo: t.tipo, catId: t.catId, meio: t.meio, cartao: t.cartao, conta: t.conta, desc: t.desc, valor: t.valor, data: t.data }); }
    else if (a === 'del') excluirLanc(id);
    fechaLinhas(null);
    return;
  }
  const aberta = ev.target.closest && ev.target.closest('.sw .row.aberta');
  if (aberta) { ev.preventDefault(); ev.stopPropagation(); fechaLinha(aberta); return; }
  if (Date.now() - ultimoArraste < 350) { ev.preventDefault(); ev.stopPropagation(); }
}, true);

(function () {
  let g = null;
  const podeMes = () => (tab === 'resumo' || tab === 'lanc') && !(tab === 'lanc' && filtro.todos);

  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || sheet.classList.contains('on') || atualizando) { g = null; return; }
    const tg = e.target, t = e.touches[0];
    const linha = tg.closest ? tg.closest('.sw .row') : null;
    if (!tg.closest || !tg.closest('.sw')) fechaLinhas(null);
    g = {
      x: t.clientX, y: t.clientY, eixo: null, dx: 0, dy: 0, linha: linha,
      livre: !tg.closest('.rolagem, .graf, input, select, textarea, .sw-acoes') &&
             t.clientX > 24 && t.clientX < window.innerWidth - 24,
      topo: window.scrollY <= 0,
      ini: linha && linha.classList.contains('aberta') ? -LARG_ACOES : 0,
      xAtual: null, pulou: false
    };
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!g) return;
    const t = e.touches[0];
    g.dx = t.clientX - g.x; g.dy = t.clientY - g.y;
    if (!g.eixo) {
      if (Math.abs(g.dx) < 8 && Math.abs(g.dy) < 8) return;
      g.eixo = Math.abs(g.dx) > Math.abs(g.dy) * 1.2 ? 'h' : 'v';
      if (g.eixo === 'h' && g.linha) { fechaLinhas(g.linha); g.linha.classList.add('arrasta'); }
    }
    if (g.eixo === 'h' && g.linha) {
      if (e.cancelable) e.preventDefault();
      const x = Math.max(-LARG_ACOES - 24, Math.min(0, g.ini + g.dx));
      g.xAtual = x; g.linha.style.transform = 'translateX(' + x + 'px)';
    } else if (g.eixo === 'v' && g.topo && g.dy > 0 && !g.linha && tab !== undefined) {
      if (e.cancelable) e.preventDefault();
      const px = Math.min(g.dy * 0.5, 80);
      const pronto = px >= 40;
      if (pronto && !g.pulou) { g.pulou = true; vib(10); }
      if (!pronto) g.pulou = false;
      mostraPux(pronto ? 'Solte para atualizar' : 'Puxe para atualizar', px, false);
    }
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (!g) return;
    const x = g;  g = null;
    if (x.eixo === 'h') {
      ultimoArraste = Date.now();
      if (x.linha) {
        x.linha.classList.remove('arrasta');
        const pos = x.xAtual === null ? x.ini : x.xAtual;
        if (x.ini === 0 && x.dx > 70 && podeMes()) { fechaLinha(x.linha); mudaMes(-1); }
        else if (pos < -LARG_ACOES / 2) abreLinha(x.linha);
        else fechaLinha(x.linha);
      } else if (x.livre && podeMes() && Math.abs(x.dx) > 70) {
        mudaMes(x.dx < 0 ? 1 : -1);
      }
    } else if (x.eixo === 'v' && x.topo && x.dy > 0 && !x.linha) {
      if (x.pulou) atualizar(); else escondePux();
    }
  }, { passive: true });

  document.addEventListener('touchcancel', () => {
    if (g && g.linha) fechaLinha(g.linha);
    g = null; if (!atualizando) escondePux();
  }, { passive: true });
})();

/* ---------- recarrega sozinho quando a internet volta ---------- */

let ultimaSync = Date.now(), sincronizando = false;

/** Busca os dados de novo, sem interromper o que você está fazendo. Só redesenha se algo mudou. */
async function sincronizar() {
  if (sincronizando || atualizando || pendentes > 0 || !CFG.url || !CFG.token) return false;
  sincronizando = true; carga(true);
  const estavaOffline = offline, t0 = Date.now();
  try {
    const novo = await api('getTudo');
    ultimaSync = Date.now(); tempoCarga = ultimaSync - t0; cargaEm = new Date();
    const mudou = JSON.stringify(novo) !== JSON.stringify(D);
    offline = false;
    if (mudou || estavaOffline) { D = novo; salvarCache(); render(); }
    if (estavaOffline) toast('De volta online — dados atualizados');
    return true;
  } catch (e) { return false; }
  finally { sincronizando = false; carga(false); }
}

window.addEventListener('online', () => { sincronizar(); });
window.addEventListener('offline', () => { if (CFG.url && CFG.token && !offline) { offline = true; render(); } });
document.addEventListener('visibilitychange', () => {
  // voltou para o app: se estava sem conexão, ou os dados têm mais de 2 minutos, atualiza
  if (!document.hidden && (offline || Date.now() - ultimaSync > 120000)) sincronizar();
});
// sem conexão: tenta de novo a cada 10 segundos (o evento "online" nem sempre chega)
setInterval(() => { if (offline && !document.hidden) sincronizar(); }, 10000);

if (CFG.url && CFG.token) carregar(); else telaConexao(true);
</script>
